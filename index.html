<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>METASYNC IA — Laboratório Digital de Biohacking & Jejum Adaptado</title>
<meta name="description" content="Sincronização Metabólica de Alta Precisão. Elimine até 10kg em 21 dias com Nutrição Adaptada e Mentoria IA 24h.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== RESET & ROOT ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:#06080A}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#06080A;color:#E1E7ED;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}

:root{
  --bg-deep:#0D0D0D;
  --bg-card:rgba(18, 24, 32, 0.65);
  --cyan-neon:#00F2FF;
  --cyan-glow:rgba(0, 242, 255, 0.35);
  --cyan-dark:#008B99;
  --cyan-light:rgba(0, 242, 255, 0.1);
  --silver:#A0AAB0;
  --silver-light:#D0D8DF;
  --border-glass:rgba(0, 242, 255, 0.18);
  --border-subtle:rgba(255, 255, 255, 0.08);
  --red-neon:#FF3B5C;
  --green-neon:#00FF87;
  --yellow-neon:#FFB800;
}

/* ===== BACKGROUND FX ===== */
body::before{
  content:'';position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:radial-gradient(circle at 50% 15%, rgba(0, 242, 255, 0.08) 0%, rgba(13, 13, 13, 0) 70%),
             radial-gradient(circle at 80% 75%, rgba(0, 255, 135, 0.04) 0%, rgba(13, 13, 13, 0) 60%);
  pointer-events:none;z-index:0;
}

/* ===== APP SHELL ===== */
#app{width:100%;max-width:440px;min-height:100vh;background:var(--bg-deep);position:relative;overflow-x:hidden;z-index:1;box-shadow:0 0 50px rgba(0, 242, 255, 0.12);border-left:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle)}

/* ===== HEADER ===== */
.quiz-header{display:flex;align-items:center;justify-content:center;padding:16px;position:relative;background:rgba(13, 13, 13, 0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-glass)}
.btn-back{position:absolute;left:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--silver);padding:4px 8px;line-height:1;display:none;transition:color .2s}
.btn-back:hover{color:var(--cyan-neon)}
.logo{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:6px;text-shadow:0 0 14px var(--cyan-glow)}
.logo-badge{background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#06080A;font-size:10px;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:0.5px}

/* ===== PROGRESS ===== */
.progress-bar-wrap{width:100%;height:3px;background:rgba(255,255,255,0.06);display:none;position:relative}
.progress-bar-fill{height:100%;background:linear-gradient(to right,var(--cyan-dark),var(--cyan-neon));transition:width .45s ease;box-shadow:0 0 10px var(--cyan-neon)}

/* ===== STEP CONTAINER ===== */
.step-wrap{padding:24px 20px 40px;min-height:calc(100vh - 75px);display:flex;flex-direction:column}
.step-wrap.anim-in{animation:fadeIn .35s ease}
.step-wrap.anim-back{animation:fadeInLeft .35s ease}

@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInLeft{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* ===== SYNC LOADER ===== */
.sync-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(13,13,13,0.88);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;animation:fadeIn .2s ease}
.sync-spinner{width:48px;height:48px;border:3px solid rgba(0,242,255,0.15);border-top:3px solid var(--cyan-neon);border-radius:50%;animation:spin .6s linear infinite;box-shadow:0 0 15px var(--cyan-glow)}
.sync-text{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--cyan-neon);margin-top:16px;text-transform:uppercase;text-shadow:0 0 10px var(--cyan-glow)}

@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* ===== TYPOGRAPHY ===== */
.q-title{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:#fff;line-height:1.35;margin-bottom:22px;white-space:pre-line;letter-spacing:-0.2px}
.q-title.center{text-align:center}
.q-sub{font-size:13.5px;color:var(--silver);line-height:1.6;margin-bottom:20px;letter-spacing:0.3px}

/* ===== GLASS CARDS & OPTIONS ===== */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:16px;cursor:pointer;transition:all .2s ease;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:var(--cyan-neon);box-shadow:0 0 20px var(--cyan-light);transform:translateY(-1px)}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--cyan-neon);background:rgba(0, 242, 255, 0.08);box-shadow:0 0 25px var(--cyan-glow)}
.opt-label{font-size:15px;font-weight:600;color:#F0F5FA;flex:1;line-height:1.4}
.opt-sub{font-size:12px;color:var(--silver);font-weight:400;margin-top:3px}
.opt-emoji{font-size:24px;margin-left:10px;flex-shrink:0}
.opt-img-l{width:56px;height:56px;border-radius:12px;object-fit:cover;margin-right:14px;flex-shrink:0;background:rgba(255,255,255,0.04);border:1px solid var(--border-glass);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}

/* Neon Checkbox */
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--silver);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-left:10px;transition:all .2s}
.opt.sel .chk{background:var(--cyan-neon);border-color:var(--cyan-neon);box-shadow:0 0 10px var(--cyan-neon)}
.chk-mark{color:#06080A;font-size:13px;font-weight:900;display:none}
.opt.sel .chk-mark{display:block}

/* ===== GENDER GRID ===== */
.gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.gender-card{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:20px;overflow:hidden;cursor:pointer;transition:all .25s ease;-webkit-tap-highlight-color:transparent}
.gender-card:hover{border-color:var(--cyan-neon);box-shadow:0 0 25px var(--cyan-glow);transform:translateY(-3px)}
.gender-card.sel{border-color:var(--cyan-neon);box-shadow:0 0 30px var(--cyan-glow)}
.gender-card-img{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:82px;background:rgba(255,255,255,0.02)}
.gender-card-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#fff}

/* ===== SIDE-IMAGE LAYOUT ===== */
.side-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
.side-img-box{border-radius:20px;overflow:hidden;background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);aspect-ratio:.68;display:flex;align-items:center;justify-content:center;font-size:84px;position:relative}
.side-opts{display:flex;flex-direction:column;gap:10px}
.side-opts .opt{padding:12px 14px}
.side-opts .opt-label{font-size:13.5px}

/* ===== BUTTONS ===== */
.btn{width:100%;padding:18px;border:none;border-radius:16px;font-family:'Montserrat',sans-serif;font-size:15.5px;font-weight:800;cursor:pointer;transition:all .2s ease;letter-spacing:0.5px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#06080A;box-shadow:0 0 20px var(--cyan-glow)}
.btn-primary:hover{box-shadow:0 0 30px rgba(0, 242, 255, 0.6);transform:translateY(-1px)}
.btn-intro{text-transform:uppercase;font-size:15px;padding:20px}
.mt16{margin-top:16px}

/* ===== GLASS INFO BOXES ===== */
.info-box{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin:16px 0;font-size:13.5px;line-height:1.6}
.info-box .ib-title{font-weight:800;font-size:14px;margin-bottom:6px}
.info-blue{border-left:4px solid var(--cyan-neon);background:rgba(0, 242, 255, 0.06)}
.info-blue .ib-title{color:var(--cyan-neon)}
.info-blue p{color:var(--silver-light)}
.info-yellow{border-left:4px solid var(--yellow-neon);background:rgba(255, 184, 0, 0.06)}
.info-yellow .ib-title{color:var(--yellow-neon)}
.info-yellow p{color:var(--silver-light)}

/* ===== SLIDER ===== */
.slider-wrap{text-align:center;margin:20px 0}
.slider-num{font-family:'Montserrat',sans-serif;font-size:56px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 15px var(--cyan-glow)}
.slider-unit-label{font-size:24px;font-weight:600;color:var(--silver);margin-left:4px}
.unit-toggle{display:inline-flex;background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);border-radius:24px;padding:4px;margin-bottom:20px}
.unit-btn{padding:7px 24px;border-radius:20px;border:none;background:none;cursor:pointer;font-weight:700;font-size:13px;color:var(--silver);transition:all .2s;font-family:inherit}
.unit-btn.active{background:var(--cyan-neon);color:#06080A;box-shadow:0 0 12px var(--cyan-glow)}
.range-track{position:relative;padding:20px 0}
input[type=range].rng{-webkit-appearance:none;width:100%;height:6px;outline:none;border-radius:4px;background:rgba(255,255,255,0.1);cursor:pointer}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--cyan-neon);cursor:pointer;box-shadow:0 0 15px var(--cyan-neon)}
.slider-hint{font-size:12px;color:var(--silver);margin-top:8px;text-align:center;letter-spacing:0.5px}
.slider-minmax{display:flex;justify-content:space-between;font-size:11px;color:var(--silver);margin-top:4px}

/* ===== AGE INPUT ===== */
.age-input{width:100%;padding:18px;background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:16px;font-size:18px;font-family:inherit;outline:none;color:#fff;margin-bottom:16px;transition:all .2s;text-align:center}
.age-input:focus{border-color:var(--cyan-neon);box-shadow:0 0 20px var(--cyan-glow)}

/* ===== FOOD PICKER ===== */
.food-cat-title{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;color:var(--cyan-neon);text-transform:uppercase;letter-spacing:1px;padding:10px 0 6px;margin-bottom:8px;border-bottom:1px solid var(--border-subtle)}
.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.food-chip{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s ease;-webkit-tap-highlight-color:transparent;color:var(--silver-light)}
.food-chip:active{transform:scale(.95)}
.food-chip.sel{border-color:var(--cyan-neon);background:rgba(0, 242, 255, 0.12);color:var(--cyan-neon);box-shadow:0 0 15px var(--cyan-glow)}
.food-chip .fc-icon{display:block;font-size:22px;margin-bottom:4px}

/* ===== SOCIAL PROOF ===== */
.sp-title{font-family:'Montserrat',sans-serif;font-size:46px;font-weight:900;text-align:center;color:#fff;text-shadow:0 0 20px var(--cyan-glow)}
.sp-sub{font-size:15px;text-align:center;color:var(--silver);margin-bottom:10px}
.sp-sub span{color:var(--cyan-neon);font-weight:700}

/* ===== CHARTS ===== */
.chart-box{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:20px;padding:16px;margin:16px 0;overflow:hidden}
canvas{max-width:100%}

/* ===== IMC BAR ===== */
.imc-track{width:100%;height:10px;border-radius:5px;background:linear-gradient(to right,#3498db 0%,var(--green-neon) 35%,var(--yellow-neon) 65%,var(--red-neon) 100%);position:relative;margin:12px 0}
.imc-thumb{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--cyan-neon);top:50%;transform:translateY(-50%) translateX(-50%);transition:left .4s ease;box-shadow:0 0 12px var(--cyan-neon)}
.imc-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--silver)}

/* ===== LOADING ===== */
.loading-bar-track{background:rgba(255,255,255,0.06);border-radius:8px;height:12px;overflow:hidden;margin:8px 0 12px;border:1px solid var(--border-subtle)}
.loading-bar-fill{height:100%;background:linear-gradient(to right,var(--cyan-dark),var(--cyan-neon));border-radius:8px;transition:width .45s ease;box-shadow:0 0 12px var(--cyan-glow)}
.loading-status{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;color:#fff;margin-bottom:4px}
.loading-sub{font-size:12.5px;color:var(--silver);margin-bottom:24px}

/* ===== TESTIMONIAL CARDS ===== */
.test-card{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:18px;padding:18px;text-align:left;margin-bottom:14px}
.test-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.test-user{display:flex;align-items:center;gap:12px}
.test-avatar{width:44px;height:44px;border-radius:50%;background:rgba(0, 242, 255, 0.1);border:1px solid var(--cyan-neon);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.test-name{font-weight:700;font-size:14px;color:#fff}
.test-stars{color:var(--cyan-neon);font-size:14px;font-weight:700}
.test-star-icon{color:var(--cyan-neon);font-size:18px;text-shadow:0 0 8px var(--cyan-glow)}
.test-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px;margin-bottom:6px;color:#fff}
.test-body{font-size:13px;color:var(--silver-light);line-height:1.6}

/* ===== WEIGHT GRAPH ===== */
.graph-wrap{position:relative;background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:20px;margin:14px 0;overflow:visible;padding:10px 10px 0}
.graph-badge{position:absolute;background:rgba(255,255,255,0.08);border:1px solid var(--border-subtle);border-radius:10px;padding:4px 12px;font-size:11.5px;font-weight:700;color:var(--silver-light)}
.graph-goal{position:absolute;right:14px;bottom:26px;background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));border-radius:8px;padding:5px 12px;font-size:12px;font-weight:900;color:#06080A;box-shadow:0 0 15px var(--cyan-glow)}
.graph-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--silver);padding:4px 6px 6px}

/* ===== SALES PAGE (DASHBOARD LAB AESTHETIC) ===== */
#sales-page{display:none;background:var(--bg-deep);max-width:440px;width:100%}
.sales-header-bar{width:100%;height:3px;background:linear-gradient(to right,var(--cyan-dark),var(--cyan-neon),var(--green-neon));box-shadow:0 0 12px var(--cyan-glow)}
.sales-logo{text-align:center;padding:16px;font-family:'Montserrat',sans-serif;font-size:16px;font-weight:900;letter-spacing:1.5px;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid var(--border-subtle)}

/* Cyberpunk App & AI Hero Banner */
.app-hero-badge{background:linear-gradient(135deg, rgba(0, 242, 255, 0.15), rgba(0, 139, 153, 0.25));border:1px solid var(--cyan-neon);backdrop-filter:blur(16px);border-radius:20px;padding:18px;margin:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 0 25px var(--cyan-glow)}
.app-badge-icon{font-size:46px;flex-shrink:0;filter:drop-shadow(0 0 8px var(--cyan-neon))}
.app-badge-txt{font-size:13px;line-height:1.45;color:var(--silver-light)}
.app-badge-txt strong{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:800;color:#fff;display:block;margin-bottom:3px}

.compare-wrap{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:22px;padding:20px;margin:14px 0}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare-ava{text-align:center;font-size:74px;margin-bottom:12px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,255,255,0.1))}
.compare-ava-label{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;color:var(--cyan-neon);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.compare-col-title{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:900;color:#fff;margin-bottom:14px}
.metric{margin-bottom:12px}
.metric-name{font-size:11px;color:var(--silver);margin-bottom:3px}
.metric-val{font-size:12px;font-weight:800;margin-bottom:4px}
.metric-bar-track{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.metric-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.fill-red{background:linear-gradient(to right,#ff6b81,var(--red-neon));box-shadow:0 0 8px var(--red-neon)}
.fill-green{background:linear-gradient(to right,var(--cyan-dark),var(--green-neon));box-shadow:0 0 8px var(--green-neon)}

.how-box{background:rgba(0, 255, 135, 0.05);border:1px solid rgba(0, 255, 135, 0.2);backdrop-filter:blur(12px);border-radius:18px;padding:20px;margin:18px 0}
.how-box h3{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;margin-bottom:8px;color:var(--green-neon)}
.how-box p{font-size:13.5px;color:var(--silver-light);line-height:1.65}

.plan-incl-title{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:900;text-align:center;color:#fff;margin:24px 0 18px;letter-spacing:-0.3px}

.plan-item{padding:22px 20px;border-bottom:1px solid var(--border-subtle);text-align:center}
.plan-icon{font-size:44px;margin-bottom:12px;filter:drop-shadow(0 0 10px var(--cyan-glow))}
.plan-title{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:800;color:#fff;margin-bottom:8px;line-height:1.35}
.plan-desc{font-size:13.5px;color:var(--silver-light);line-height:1.6}

/* Expert Card */
.expert-card{background:linear-gradient(135deg, rgba(20, 25, 35, 0.7), rgba(10, 15, 20, 0.9));border:1px solid var(--cyan-neon);backdrop-filter:blur(16px);border-radius:24px;padding:22px;margin:26px 20px;text-align:center;box-shadow:0 0 30px var(--cyan-light)}
.expert-avatar{width:96px;height:96px;border-radius:50%;background:rgba(0, 242, 255, 0.1);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:52px;border:2px solid var(--cyan-neon);box-shadow:0 0 20px var(--cyan-glow)}
.expert-name{font-family:'Montserrat',sans-serif;font-size:19px;font-weight:900;color:#fff;margin-bottom:3px}
.expert-title{font-size:11.5px;font-weight:800;color:var(--cyan-neon);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.expert-bio{font-size:13px;color:var(--silver-light);line-height:1.65}

/* FAQ Accordion */
.faq-wrap{padding:0 20px;margin:24px 0}
.faq-item{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:16px;margin-bottom:12px;overflow:hidden}
.faq-q{padding:18px 16px;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.faq-q span{color:var(--cyan-neon);font-size:20px;transition:transform .25s ease;text-shadow:0 0 8px var(--cyan-glow)}
.faq-item.open .faq-q span{transform:rotate(45deg)}
.faq-a{padding:0 16px 18px;font-size:13px;color:var(--silver-light);line-height:1.65;display:none;border-top:1px solid var(--border-subtle)}
.faq-item.open .faq-a{display:block}

/* Pricing Card */
.price-badge{background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#06080A;border-radius:14px 14px 0 0;padding:14px 16px;text-align:center;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:900;letter-spacing:0.5px}
.price-card{background:var(--bg-card);border:2px solid var(--cyan-neon);border-top:none;border-radius:0 0 16px 16px;padding:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 25px var(--cyan-light)}

const QUESTION_IDS = STEPS.filter(s=>['single','multi','multi-card','slider','age-input','food-picker'].includes(s.type)).map(s=>s.id);
const TOTAL_Q = QUESTION_IDS.length;

function render(){
  const step = STEPS[currentStep];
  const wrap = document.getElementById('stepWrap');
  const pbWrap = document.getElementById('pbWrap');
  const pbFill = document.getElementById('pbFill');
  const back = document.getElementById('btnBack');

  if(step.type === 'intro' || step.type === 'gender'){
    pbWrap.style.display = 'none';
    back.style.display = 'none';
  } else {
    pbWrap.style.display = 'block';
    back.style.display = (currentStep > 1) ? 'block' : 'none';
    const qIdx = QUESTION_IDS.indexOf(step.id);
    const pct = qIdx >= 0 ? Math.round(((qIdx+1)/TOTAL_Q)*100) : Math.min(98, Math.round((currentStep/STEPS.length)*100));
    pbFill.style.width = pct + '%';
  }

  wrap.className = 'step-wrap ' + (goingBack ? 'anim-back' : 'anim-in');
  goingBack = false;

  switch(step.type){
    case 'intro':          wrap.innerHTML = renderIntro(); break;
    case 'gender':         wrap.innerHTML = renderGender(); break;
    case 'single':         wrap.innerHTML = renderSingle(step); break;
    case 'multi':          wrap.innerHTML = renderMulti(step); break;
    case 'multi-card':     wrap.innerHTML = renderMultiCard(step); break;
    case 'slider':         wrap.innerHTML = renderSlider(step); postSlider(step); break;
    case 'age-input':      wrap.innerHTML = renderAgeInput(step); break;
    case 'food-picker':    wrap.innerHTML = renderFoodPicker(); break;
    case 'info-social':    wrap.innerHTML = renderInfoSocial(); break;
    case 'info-chart1':    wrap.innerHTML = renderInfoChart1(); setTimeout(drawChart1,80); break;
    case 'info-metabolism':wrap.innerHTML = renderInfoMetabolism(); setTimeout(drawMetabolism,80); break;
    case 'info-face':      wrap.innerHTML = renderInfoFace(); break;
    case 'imc-summary':    wrap.innerHTML = renderIMCSummary(); break;
    case 'weight-graph':   wrap.innerHTML = renderWeightGraphScreen(); setTimeout(()=>drawWeightGraph('wgcanvas'),100); break;
    case 'loading':        wrap.innerHTML = renderLoading(); startLoading(); break;
    case 'result':         wrap.innerHTML = renderResult(); setTimeout(()=>drawWeightGraph('rcanvas'),100); break;
    default: wrap.innerHTML = '<p>Step not found</p>';
  }
  window.scrollTo(0,0);
}

function triggerSyncNext(){
  const app = document.getElementById('app');
  const sync = document.createElement('div');
  sync.className = 'sync-overlay';
  sync.innerHTML = `
    <div class="sync-spinner"></div>
    <div class="sync-text">Sincronização Metabólica...</div>
  `;
  app.appendChild(sync);

  setTimeout(() => {
    sync.remove();
    next();
  }, 480);
}

function next(){ if(currentStep < STEPS.length-1){ currentStep++; render(); } }
function goBack(){ if(currentStep > 0){ goingBack=true; currentStep--; render(); } }

function drawWeightGraph(id){
  const c=document.getElementById(id); if(!c) return;
  const ctx=c.getContext('2d');
  c.width=c.offsetWidth||380; const W=c.width,H=c.height,P=20;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
  for(let i=0;i<4;i++){ const y=P+i*((H-2*P)/3); ctx.beginPath(); ctx.moveTo(P,y); ctx.lineTo(W-P,y); ctx.stroke(); }
  const pts=[];
  for(let i=0;i<8;i++){
    const t=i/7;
    const x=P+t*(W-2*P);
    const y=P+(1-t)*(1-t)*0.85*(H-2*P)+P*0.2+Math.sin(i*1.8)*4;
    pts.push({x,y});
  }
  const ag=ctx.createLinearGradient(0,P,0,H-P);
  ag.addColorStop(0,'rgba(255,59,92,0.28)'); ag.addColorStop(.5,'rgba(255,184,0,0.18)'); ag.addColorStop(1,'rgba(0,242,255,0.1)');
  ctx.beginPath(); ctx.moveTo(pts[0].x,H-P); ctx.lineTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){ const c1x=(pts[i-1].x+pts[i].x)/2; ctx.bezierCurveTo(c1x,pts[i-1].y,c1x,pts[i].y,pts[i].x,pts[i].y); }
  ctx.lineTo(pts[pts.length-1].x,H-P); ctx.closePath(); ctx.fillStyle=ag; ctx.fill();
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){ const c1x=(pts[i-1].x+pts[i].x)/2; ctx.bezierCurveTo(c1x,pts[i-1].y,c1x,pts[i].y,pts[i].x,pts[i].y); }
  ctx.strokeStyle='#00F2FF'; ctx.lineWidth=2.5; ctx.shadowColor='#00F2FF'; ctx.shadowBlur=12; ctx.stroke(); ctx.shadowBlur=0;
  const cols=['#FF3B5C','#FF3B5C','#FFB800','#FFB800','#00FF87','#00F2FF','#00F2FF','#00F2FF'];
  pts.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p.x,p.y,5.5,0,Math.PI*2); ctx.fillStyle=cols[i]; ctx.fill(); ctx.strokeStyle='#06080A'; ctx.lineWidth=2; ctx.stroke(); });
}

function drawChart1(){
  const c=document.getElementById('c1'); if(!c) return;
  const ctx=c.getContext('2d'); c.width=c.offsetWidth||360;
  const W=c.width,H=c.height,P=16;
  ctx.clearRect(0,0,W,H);
  const bw=56,gap=W/4;
  function drawBar(x,bH,c1,c2,lbl){
    const top=H-P-bH;
    const g=ctx.createLinearGradient(0,top,0,H-P);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.beginPath(); ctx.roundRect(x,top,bw,bH,8); ctx.fillStyle=g; ctx.fill();
    const chipY=top-24;
    ctx.fillStyle='rgba(18,24,32,0.9)'; ctx.beginPath(); ctx.roundRect(x-4,chipY,bw+8,18,6); ctx.fill();
    ctx.strokeStyle='rgba(0,242,255,0.2)'; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 9px Montserrat'; ctx.textAlign='center'; ctx.fillText(lbl,x+bw/2,chipY+12);
  }
  drawBar(gap-bw/2,0.68*(H-P*2),'#FF3B5C','#881122','GORDURA ☠️ ↑');
  drawBar(3*gap-bw/2,0.78*(H-P*2),'#00F2FF','#008B99','ENERGIA ⚡ ↑');
  ctx.strokeStyle='var(--cyan-neon)'; ctx.lineWidth=2.5; ctx.shadowColor='var(--cyan-neon)'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.moveTo(2*gap-18,H/2); ctx.lineTo(2*gap+18,H/2);
  ctx.moveTo(2*gap+10,H/2-7); ctx.lineTo(2*gap+18,H/2); ctx.lineTo(2*gap+10,H/2+7); ctx.stroke(); ctx.shadowBlur=0;
  ctx.fillStyle='var(--silver)'; ctx.font='10px Inter'; ctx.textAlign='center';
  ctx.fillText('ESTADO ANTERIOR',gap,H-2); ctx.fillText('METASYNC LAB',3*gap,H-2);
}

function drawMetabolism(){
  const c=document.getElementById('cmet'); if(!c) return;
  const ctx=c.getContext('2d'); c.width=c.offsetWidth||360;
  const W=c.width,H=c.height,P=24,N=8,BW=(W-2*P)/(N*1.8);
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<N;i++){
    const x=P+i*(W-2*P)/N+2;
    const bH=(0.4+0.45*Math.sin(i/N*Math.PI+.3))*(H-P*2);
    const g=ctx.createLinearGradient(0,H-P-bH,0,H-P);
    g.addColorStop(0,'#00F2FF'); g.addColorStop(1,'#008B99');
    ctx.beginPath(); ctx.roundRect(x,H-P-bH,BW,bH,4); ctx.fillStyle=g; ctx.fill();
  }
  const pp=[];
  for(let i=0;i<=N;i++){ const t=i/N; pp.push({x:P+t*(W-2*P),y:P+(0.35+0.4*Math.sin(t*Math.PI*.7+.6))*(H-P*2)}); }
  ctx.beginPath(); ctx.moveTo(pp[0].x,pp[0].y);
  pp.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pp[N].x,H-P); ctx.lineTo(pp[0].x,H-P); ctx.fillStyle='rgba(255,59,92,.12)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(pp[0].x,pp[0].y); pp.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle='#FF3B5C'; ctx.lineWidth=2.5; ctx.stroke();
  const lx1=P+4,ly1=H-P-0.55*(H-P*2)-16;
  ctx.fillStyle='rgba(0, 242, 255, 0.15)'; ctx.beginPath(); ctx.roundRect(lx1,ly1,88,18,4); ctx.fill();
  ctx.fillStyle='var(--cyan-neon)'; ctx.font='bold 10px Montserrat'; ctx.textAlign='left'; ctx.fillText('Flexibilidade',lx1+6,ly1+13);
  ctx.fillStyle='rgba(255, 59, 92, 0.15)'; ctx.beginPath(); ctx.roundRect(W-P-60,P+4,56,18,4); ctx.fill();
  ctx.fillStyle='#FF3B5C'; ctx.textAlign='right'; ctx.fillText('Gordura',W-P-6,P+17);
}

function toDisplay(val,key,unit){
  if(key==='height' && unit==='pol') return Math.round(val/2.54);
