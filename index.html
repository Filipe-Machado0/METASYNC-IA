/* ===== RESET & ROOT ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:#F5F3EE}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#F5F3EE;color:#2C3539;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}

:root{

  --bg-card:#FFFFFF;
  --cyan-neon:#007A87;
  --cyan-glow:rgba(0, 122, 135, 0.15);

}

/* ===== BACKGROUND FX ===== */
body::before{
  content:'';position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:radial-gradient(circle at 50% 15%, rgba(0, 122, 135, 0.04) 0%, rgba(245, 243, 238, 0) 70%),
             radial-gradient(circle at 80% 75%, rgba(217, 138, 108, 0.02) 0%, rgba(245, 243, 238, 0) 60%);

}

.btn-back{position:absolute;left:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--silver);padding:4px 8px;line-height:1;display:none;transition:color .2s}
.btn-back:hover{color:var(--cyan-neon)}
.logo{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:6px;text-shadow:0 0 14px var(--cyan-glow)}
.logo-badge{background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:0.5px}

/* ===== PROGRESS BAR ===== */
.progress-bar-wrap{height:5px;background:rgba(0, 0, 0, 0.04);position:relative;overflow:hidden;border-bottom:1px solid var(--border-subtle);display:none}
.progress-bar-fill{height:100%;background:linear-gradient(to right,var(--cyan-dark),var(--cyan-neon));border-radius:0 3px 3px 0;transition:width .35s cubic-bezier(0.4, 0, 0.2, 1);box-shadow:0 0 10px var(--cyan-glow)}

/* ===== STEP CONTAINER ===== */
.step-wrap{padding:20px;flex:1;display:flex;flex-direction:column;justify-content:flex-start}
.anim-in{animation:fadeInRight .25s ease-out forwards}
.anim-back{animation:fadeInLeft .25s ease-out forwards}
@keyframes fadeInRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeInLeft{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== TYPOGRAPHY ===== */
.q-title{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:900;line-height:1.35;margin-bottom:8px;color:#143540;letter-spacing:-0.4px}
.q-title.center{text-align:center}
.q-sub{font-size:13px;color:var(--silver);margin-bottom:18px;line-height:1.55}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 24px;border-radius:16px;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:900;cursor:pointer;border:none;transition:all .2s ease;text-decoration:none;letter-spacing:0.5px;width:100%;box-sizing:border-box}

.btn-primary{background:linear-gradient(135deg,var(--cyan-neon),#005a63);color:#fff;box-shadow:0 4px 20px var(--cyan-glow)}

.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}

.opt:hover{border-color:var(--cyan-neon);background:rgba(255,255,255,0.95)}
.opt:active{transform:scale(0.98)}
.opt.sel{border-color:var(--cyan-neon);background:var(--cyan-light);box-shadow:0 0 16px var(--cyan-glow)}
.opt-label{font-size:13.5px;font-weight:700;color:var(--silver-light);line-height:1.35}

.opt-sub{font-size:11.5px;color:var(--silver);margin-top:3px;font-weight:400;line-height:1.4}
.opt-emoji{font-size:20px;margin-right:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

.opt.sel .chk{border-color:var(--cyan-neon);background:var(--cyan-neon)}
.chk-mark{display:none;color:#fff;font-size:13px;font-weight:900}
.opt.sel .chk-mark{display:block}

.route-box{background:var(--bg-card);border:1.5px solid var(--cyan-neon);border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 0 24px var(--cyan-glow);text-align:left}
.route-tag{display:inline-block;background:rgba(0,122,135,0.12);color:var(--cyan-neon);font-size:10px;font-weight:900;padding:4px 10px;border-radius:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.route-title{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:900;color:#143540;margin-bottom:10px;line-height:1.35}
.route-desc{font-size:13px;color:var(--silver-light);line-height:1.6;margin-bottom:14px}
.route-rec{background:rgba(0,122,135,0.05);border-left:3px solid var(--cyan-neon);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:14px}
.route-rec-title{font-size:11px;font-weight:900;color:var(--cyan-neon);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.route-rec-txt{font-size:12.5px;color:var(--silver-light);line-height:1.5}

.route-list-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--silver-light);line-height:1.5;margin-bottom:6px}
.route-list-item span.chk-ico{color:var(--cyan-neon);font-weight:900}

/* ===== LOADING ANIMATION ===== */
.loading-bar-track{background:rgba(0,0,0,0.05);border-radius:8px;height:12px;overflow:hidden;margin:12px 0 16px;border:1px solid var(--border-subtle)}
.loading-bar-fill{height:100%;background:linear-gradient(to right,var(--cyan-dark),var(--cyan-neon));border-radius:8px;transition:width .4s ease;box-shadow:0 0 12px var(--cyan-glow)}

/* ===== SYNC SPINNER OVERLAY ===== */
.sync-overlay{position:fixed;inset:0;background:rgba(252,250,246,0.92);backdrop-filter:blur(8px);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.sync-spinner{width:36px;height:36px;border:3px solid var(--border-glass);border-top-color:var(--cyan-neon);border-radius:50%;animation:spin .6s linear infinite}
.sync-text{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;color:#143540;letter-spacing:0.5px}

/* ===== SALES PAGE ===== */
#sales-page{display:none;background:var(--bg-deep);max-width:440px;width:100%}
.pricing-section{padding:24px 20px 0}
.plan-card-box{background:var(--bg-card);border:1px solid var(--border-glass);border-radius:24px;padding:24px 20px;position:relative;margin-bottom:20px;box-shadow:0 4px 20px rgba(0,0,0,0.03)}

.plan-title-head{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:900;color:#143540;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}

.demo-container{background:var(--bg-card);border:1px solid var(--border-glass);border-radius:24px;padding:18px;margin:20px 20px 0}

.demo-tab.active{background:#fff;color:#143540;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.demo-pane{display:none}

.demo-msg-bubble{background:rgba(0,122,135,0.06);border:1px solid var(--border-glass);border-radius:16px;padding:14px;font-size:12.5px;line-height:1.55;color:var(--silver-light)}
.demo-chip{padding:8px 12px;background:#fff;border:1px solid var(--border-glass);border-radius:12px;font-size:11px;font-weight:700;color:var(--cyan-neon);cursor:pointer;margin:4px 0;width:100%;text-align:left}

.faq-wrap{display:flex;flex-direction:column;gap:8px}
.faq-item{background:var(--bg-card);border:1px solid var(--border-glass);border-radius:14px;overflow:hidden}
.faq-q{padding:14px 16px;font-size:13px;font-weight:800;color:#143540;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.faq-a{display:none;padding:0 16px 14px;font-size:12.5px;color:var(--silver);line-height:1.55}

#socialToast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(20,53,64,0.96);backdrop-filter:blur(10px);color:#fff;border:1px solid var(--cyan-neon);border-radius:16px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,0.25);z-index:9999;max-width:360px;width:90%;display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);font-size:12px;pointer-events:none}

</style>

function getRouteData() {
  const b = ud.mainBlocker;
  if (b === 'Emagreço e depois recupero o peso') return ROUTES.rota_sanfona;
  if (b === 'Começo motivado, mas abandono depois de alguns dias') return ROUTES.rota_consistencia;
  if (b === 'Já tentei dietas genéricas que não cabiam na minha rotina') return ROUTES.rota_generica;
  if (b === 'Como mais quando estou cansado, ansioso ou sob pressão') return ROUTES.rota_comportamento;
  if (b === 'Não sei qual estratégia realmente funciona para mim') return ROUTES.rota_generica;
  return ROUTES.rota_consistencia;
}

// IDs exatos das 9 perguntas
const QUESTION_IDS = [
  'ageRange',
  'goal',
  'mainBlocker',
  'attemptsHistory',
  'triggerOffPlan',
  'workRoutine',
  'mealRoutine',
  'dietaryRestrictions',
  'physicalActivity'
];
const TOTAL_Q = QUESTION_IDS.length;

let currentStep = 0;
let goingBack = false;

function render(){
  const step = STEPS[currentStep];
  const wrap = document.getElementById('stepWrap');
  const pbWrap = document.getElementById('pbWrap');
  const pbFill = document.getElementById('pbFill');
  const back = document.getElementById('btnBack');
  const credBadge = document.getElementById('credibilityBadge');

  if (!wrap || !step) return;

  const isQuestion = QUESTION_IDS.includes(step.id);
  const qIdx = QUESTION_IDS.indexOf(step.id);

  if (pbWrap && back && pbFill) {
    if(step.type === 'intro'){
      pbWrap.style.display = 'none';
      back.style.display = 'none';
      if(credBadge) credBadge.style.display = 'block';
    } else {
      pbWrap.style.display = 'block';
      back.style.display = (currentStep > 0 && step.type !== 'result') ? 'block' : 'none';
      if(credBadge) credBadge.style.display = 'none';
      const pct = isQuestion
        ? Math.round(((qIdx + 1) / TOTAL_Q) * 100)
        : (step.type === 'loading' ? 95 : 100);
      pbFill.style.width = pct + '%';
    }
  }

  wrap.className = 'step-wrap ' + (goingBack ? 'anim-back' : 'anim-in');
  goingBack = false;

  switch(step.type){
    case 'intro':           wrap.innerHTML = renderIntro(); break;
    case 'single':          wrap.innerHTML = renderSingle(step); break;
    case 'multi':           wrap.innerHTML = renderMulti(step); break;
    case 'multi-exclusive': wrap.innerHTML = renderMultiExclusive(step); break;
    case 'loading':         wrap.innerHTML = renderLoading(); startLoading(); break;
    case 'result':          wrap.innerHTML = renderResult(); break;
    default: wrap.innerHTML = '<p>Etapa não encontrada</p>';
  }
  window.scrollTo(0,0);
  saveQuizProgress();

  // Rastreamento granular
  if(isQuestion) {
    trackEvent('quiz_step_viewed', {
      step_id: step.id,
      question_number: qIdx + 1,
      total_questions: TOTAL_Q
    });
  }
}

function showValidationError(msg){
  haptic();
  let err = document.getElementById('valError');
  if(!err){
    err = document.createElement('div');
    err.id = 'valError';
    err.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(217,138,108,0.96);color:#fff;border:1px solid #D98A6C;backdrop-filter:blur(10px);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:10000;text-align:center;max-width:360px;width:90%;transition:all .3s ease';
    document.body.appendChild(err);
  }
  err.textContent = '⚠️ ' + msg;
  err.style.display = 'block';
  setTimeout(() => {
    if(err) err.style.display = 'none';
  }, 3200);
}

function validateCurrentStep(){
  const step = STEPS[currentStep];
  if(!step) return true;

  if(step.type === 'single'){
    if(step.key && !ud[step.key]){
      showValidationError('Por favor, selecione uma opção para continuar.');
      return false;
    }
  }

  if(step.type === 'multi' || step.type === 'multi-exclusive'){
    const val = ud[step.key];
    if(!val || val.length === 0){
      showValidationError('Por favor, selecione pelo menos 1 opção para continuar.');
      return false;
    }
  }

  return true;
}

function triggerSyncNext(){
  if(!validateCurrentStep()) return;
  haptic();

  const step = STEPS[currentStep];
  if(step && step.type === 'intro') {
    trackEvent('quiz_started', {});
  }

  const app = document.getElementById('app');
  const sync = document.createElement('div');
  sync.className = 'sync-overlay';
  sync.innerHTML = '<div class="sync-spinner"></div><div class="sync-text">Organizando sua avaliação...</div>';
  app.appendChild(sync);

  setTimeout(() => {
    sync.remove();
    next();
  }, 380);
}

function next(){
  if(currentStep < STEPS.length - 1){
    const step = STEPS[currentStep];
    if(step && QUESTION_IDS.includes(step.id)) {
      trackEvent('quiz_step_completed', {
        step_id: step.id,
        question_number: QUESTION_IDS.indexOf(step.id) + 1,
        total_questions: TOTAL_Q
      });
    }
    currentStep++;
    render();
  }
}

function goBack(){
  if(currentStep > 0){
    goingBack = true;
    currentStep--;
    render();
  }
}

function esc(str){
  if(!str) return '';
  return String(str).replace(/'/g, "\\\\'").replace(/"/g, '&quot;');
}

function renderSingle(step){
  const saved = ud[step.key];
  const qNum = QUESTION_IDS.indexOf(step.id) + 1;
  const qLabel = qNum > 0 ? `<div style="font-size:11px;font-weight:700;color:var(--cyan-neon);letter-spacing:1px;margin-bottom:8px">PERGUNTA ${qNum} DE ${TOTAL_Q}</div>` : '';
  const halftimeBadge = qNum === Math.ceil(TOTAL_Q/2) ? `<div style="display:inline-block;background:rgba(217,138,108,0.12);color:var(--red-neon);font-size:11px;font-weight:800;padding:6px 14px;border-radius:20px;margin-bottom:12px;letter-spacing:0.5px">🎉 Você já está na metade!</div><br>` : '';

  return `
  <div>
    ${qLabel}
    ${halftimeBadge}
    <h2 class="q-title">${step.q}</h2>
    ${step.sub ? `<p class="q-sub">${step.sub}</p>` : ''}
    <div class="opts">
      ${step.opts.map(o => `
      <div class="opt ${saved === o.l ? 'sel' : ''}" onclick="selSingle('${step.key}', '${esc(o.l)}', this)">
        <div style="display:flex;align-items:center;gap:10px;flex:1">
          ${o.e ? `<span class="opt-emoji">${o.e}</span>` : ''}
          <div style="flex:1">
            <div class="opt-label">${o.l}</div>
            ${o.sub ? `<div class="opt-sub">${o.sub}</div>` : ''}
          </div>
        </div>
        <div class="chk"><span class="chk-mark">✓</span></div>
      </div>`).join('')}
    </div>
  </div>`;
}

function selSingle(key, val, el){
  haptic();
  const optsContainer = el.closest('.opts');
  if(optsContainer) {
    optsContainer.querySelectorAll('.opt').forEach(e => e.classList.remove('sel'));
  }
  el.classList.add('sel');
  ud[key] = val;

  const feedbacks = [
    "Entendido!",
    "Isso ajuda a calibrar sua rota.",
    "Anotado!",
    "Excelente.",
    "Resposta registrada."
  ];
  const randomFeedback = feedbacks[Math.floor(Math.random() * feedbacks.length)];
  let labelWrap = el.querySelector('.opt-label') || el;
  let feedEl = el.querySelector('.micro-feedback');
  if(!feedEl) {
    feedEl = document.createElement('div');
    feedEl.className = 'micro-feedback';
    feedEl.style.cssText = 'font-size:11px;color:var(--cyan-neon);font-weight:800;margin-top:4px;animation:fadeIn 0.2s';
    labelWrap.appendChild(feedEl);
  }
  feedEl.textContent = '✓ ' + randomFeedback;

  setTimeout(next, 420);
}

function renderMulti(step){
  const saved = ud[step.key] || [];
  const qNum = QUESTION_IDS.indexOf(step.id) + 1;
  const qLabel = qNum > 0 ? `<div style="font-size:11px;font-weight:700;color:var(--cyan-neon);letter-spacing:1px;margin-bottom:8px">PERGUNTA ${qNum} DE ${TOTAL_Q}</div>` : '';

  return `
  <div>
    ${qLabel}
    <h2 class="q-title">${step.q}</h2>
    ${step.sub ? `<p class="q-sub">${step.sub}</p>` : ''}
    <div class="opts">
      ${step.opts.map(o => `
      <div class="opt ${saved.includes(o.l) ? 'sel' : ''}" onclick="togMulti('${step.key}', '${esc(o.l)}', this)">
        <div style="display:flex;align-items:center;gap:10px;flex:1">
          ${o.e ? `<span class="opt-emoji">${o.e}</span>` : ''}
          <div class="opt-label">${o.l}</div>
        </div>
        <div class="chk"><span class="chk-mark">✓</span></div>
      </div>`).join('')}
    </div>
    <div class="mt16">
      <button class="btn btn-primary" onclick="triggerSyncNext()">Continuar</button>
    </div>
  </div>`;
}

function togMulti(key, val, el){
  haptic();
  el.classList.toggle('sel');
  if(!ud[key]) ud[key] = [];
  const idx = ud[key].indexOf(val);
  if(idx > -1){
    ud[key].splice(idx, 1);
  } else {
    ud[key].push(val);
  }
}

function renderMultiExclusive(step){
  const saved = ud[step.key] || [];
  const qNum = QUESTION_IDS.indexOf(step.id) + 1;
  const qLabel = qNum > 0 ? `<div style="font-size:11px;font-weight:700;color:var(--cyan-neon);letter-spacing:1px;margin-bottom:8px">PERGUNTA ${qNum} DE ${TOTAL_Q}</div>` : '';

  return `
  <div>
    ${qLabel}
    <h2 class="q-title">${step.q}</h2>
    ${step.sub ? `<p class="q-sub">${step.sub}</p>` : ''}
    <div class="opts">
      ${step.opts.map(o => `
      <div class="opt ${saved.includes(o.l) ? 'sel' : ''}" onclick="togMultiExclusive('${step.key}', '${esc(o.l)}', ${!!o.exclusive}, this)">
        <div style="display:flex;align-items:center;gap:10px;flex:1">
          ${o.e ? `<span class="opt-emoji">${o.e}</span>` : ''}
          <div class="opt-label">${o.l}</div>
        </div>
        <div class="chk"><span class="chk-mark">✓</span></div>
      </div>`).join('')}
    </div>
    <div class="mt16">
      <button class="btn btn-primary" onclick="triggerSyncNext()">Continuar</button>
    </div>
  </div>`;
}

function togMultiExclusive(key, val, isExclusive, el){
  haptic();
  if(!ud[key]) ud[key] = [];
  const container = el.closest('.opts');
  
  if(isExclusive){
    ud[key] = [val];
    if(container){
      container.querySelectorAll('.opt').forEach(optEl => optEl.classList.remove('sel'));
    }
    el.classList.add('sel');
  } else {
    // Remove exclusive items if present
    const exclIdx = ud[key].indexOf('Nenhuma');
    if(exclIdx > -1) ud[key].splice(exclIdx, 1);
    if(container){
      container.querySelectorAll('.opt').forEach(optEl => {
        if(optEl.textContent.includes('Nenhuma')) optEl.classList.remove('sel');
      });
    }

    el.classList.toggle('sel');
    const idx = ud[key].indexOf(val);
    if(idx > -1){
      ud[key].splice(idx, 1);
    } else {
      ud[key].push(val);
    }
  }
}

function startLoading(){
  let pct = 0;
  const bar = document.getElementById('lBar');
  const txt = document.getElementById('lPct');
  const status = document.getElementById('lStatus');
  
  const timer = setInterval(() => {
    pct += 5;
    if(bar) bar.style.width = pct + '%';
    if(txt) txt.textContent = pct + '%';
    
    if(status){
      if(pct === 30) status.textContent = "Identificando o principal bloqueio...";
      if(pct === 65) status.textContent = "Selecionando a rota mais compatível...";
      if(pct === 90) status.textContent = "Concluindo sua avaliação...";
    }
    
    if(pct >= 100){
      clearInterval(timer);
      setTimeout(next, 300);
    }
  }, 90);
}

function submitLeadAndShowSales(){
  haptic();

  if(!name){

  if(!contact || !contact.includes('@')){

  if(!consent){

  try {
    ud.leadName = name;

  } catch(e){}
  
  showSales();

let isAudioPlaying = false;
function toggleAudioPlay(){
  haptic();
  const btn = document.getElementById('audioPlayBtn');
  const timeTxt = document.getElementById('audioTimeTxt');
  let audioEl = document.getElementById('draMayaAudioEl');

  if(!audioEl){
    audioEl = document.createElement('audio');
    audioEl.id = 'draMayaAudioEl';
    audioEl.src = 'dra_maya_audio.mp3?v=2';
    document.body.appendChild(audioEl);
  }

  if(!audioEl.paused){
    audioEl.pause();
    isAudioPlaying = false;
    if(btn) btn.textContent = '▶';
    if(timeTxt) timeTxt.textContent = 'Ouvir áudio explicativo de 45s';
  } else {
    audioEl.play().then(() => {
      isAudioPlaying = true;
      if(btn) btn.textContent = '⏸';
      if(timeTxt) timeTxt.textContent = 'Reproduzindo áudio explicativo...';
      audioEl.onended = () => {
        isAudioPlaying = false;
        if(btn) btn.textContent = '▶';
        if(timeTxt) timeTxt.textContent = 'Ouvir áudio explicativo de 45s';
      };
    }).catch(err => {
      console.error("Erro ao reproduzir áudio:", err);
      audioEl.controls = true;
    });
  }
}

function togFaq(el){

function goToCheckout(plan){
  haptic();
  try {
    trackEvent('checkout_started', { plan: plan, route_id: ud.route });
    if(typeof fbq === 'function') {
      fbq('track', 'InitiateCheckout', { content_name: 'MetaSync Plan', plan: plan });
    }
  } catch(e){}

  const proLink = document.getElementById('utmify-checkout-pro');
  const basicLink = document.getElementById('utmify-checkout-basic');
  const targetUrl = (plan === 'basic' && basicLink) ? basicLink.href : (proLink ? proLink.href : 'https://checkout.perfectpay.com.br/pay/PPU38CQF97R');

  // Propagar parâmetros UTM
  const currentParams = window.location.search;
  let finalUrl = targetUrl;
  if(currentParams && currentParams.length > 1){
    const cleanParams = currentParams.startsWith('?') ? currentParams.substring(1) : currentParams;
    finalUrl += (finalUrl.includes('?') ? '&' : '?') + cleanParams;
  }
  window.location.href = finalUrl;
}

// ═══ TOAST PROVA SOCIAL DISCRETA ══════════════════════════════════════
let toastIndex = 0;
let socialToastStarted = false;
function startSocialToastNotification(){
  if(socialToastStarted) return;
  socialToastStarted = true;
  const toasts = [
    { n: 'Mariana S.', c: 'São Paulo - SP', t: 'há 2 min' },
    { n: 'Felipe M.', c: 'Belo Horizonte - MG', t: 'há 4 min' },
    { n: 'Camila R.', c: 'Curitiba - PR', t: 'há 1 min' },
    { n: 'Lucas T.', c: 'Rio de Janeiro - RJ', t: 'há 3 min' },
    { n: 'Rafael B.', c: 'Porto Alegre - RS', t: 'há 5 min' }
  ];

  let container = document.getElementById('socialToast');
  if(!container){
    container = document.createElement('div');
    container.id = 'socialToast';
    document.body.appendChild(container);
  }

  function showNextToast(){
    const item = toasts[toastIndex % toasts.length];
    toastIndex++;
    container.innerHTML = '<div class="toast-avatar">⚡</div><div class="toast-body"><strong>' + item.n + '</strong> (' + item.c + ') iniciou a <strong>Rota MetaSync</strong>!<div class="toast-time">Início recente • ' + item.t + '</div></div>';
    container.classList.add('show');
    setTimeout(() => {
      container.classList.remove('show');
    }, 4000);
  }

  setTimeout(showNextToast, 3000);
  setInterval(showNextToast, 12000);
}

function haptic(){
  try { if('vibrate' in navigator) navigator.vibrate(10); } catch(e){}
}

    localStorage.setItem('metasync_step', currentStep);

function checkAutoShowSales(){
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get('sales') === '1' || params.get('sales') === 'true' || params.get('demo') === '1') {
      showSales();
      return true;
    }
  } catch (e) {}
  return false;
}

function initApp(){
  try {
    if (!checkAutoShowSales()) {
      render();
    }
  } catch(e) {
    console.error("Erro na inicialização:", e);
    try { render(); } catch(err) {}
  }
}

if (document.readyState === 'interactive' || document.readyState === 'complete') {
  initApp();
} else {
  document.addEventListener('DOMContentLoaded', initApp);
}
