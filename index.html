<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seca Jejum — Plano Personalizado de Jejum Adaptado & Mentoria IA 24h</title>
<meta name="description" content="Descubra seu Plano Personalizado de Jejum Adaptado. Elimine até 10kg em 21 dias sem passar fome e sem efeito sanfona com acompanhamento de IA 24h.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#e8e8e8;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}

/* ===== VARIABLES ===== */
:root{
  --primary:#1BC9B5;
  --primary-dark:#17b0a0;
  --primary-light:#e0f9f6;
  --text:#1a1a1a;
  --text-muted:#666;
  --border:#e8e8e8;
  --red:#e74c3c;
  --green:#27ae60;
  --yellow:#f39c12;
}

/* ===== APP SHELL ===== */
#app{width:100%;max-width:430px;min-height:100vh;background:#fff;position:relative;overflow-x:hidden}

/* ===== HEADER ===== */
.quiz-header{display:flex;align-items:center;justify-content:center;padding:14px 16px;position:relative;background:#fff}
.btn-back{position:absolute;left:14px;background:none;border:none;font-size:22px;cursor:pointer;color:#333;padding:4px 8px;line-height:1;display:none}
.logo{font-size:15px;font-weight:800;color:#1a1a1a;display:flex;align-items:center;gap:5px;letter-spacing:-0.3px}

/* ===== PROGRESS ===== */
.progress-bar-wrap{width:100%;height:4px;background:#e8e8e8;display:none}
.progress-bar-fill{height:100%;background:var(--primary);transition:width .45s ease;border-radius:0 2px 2px 0}

/* ===== STEP CONTAINER ===== */
.step-wrap{padding:22px 20px 36px;min-height:calc(100vh - 70px);display:flex;flex-direction:column}
.step-wrap.anim-in{animation:slideIn .28s ease}
.step-wrap.anim-back{animation:slideInLeft .28s ease}

@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:translateX(0)}}

/* ===== TYPOGRAPHY ===== */
.q-title{font-size:21px;font-weight:900;color:var(--text);line-height:1.3;margin-bottom:22px;white-space:pre-line}
.q-title.center{text-align:center}
.q-sub{font-size:13px;color:var(--text-muted);line-height:1.55;margin-bottom:18px}

/* ===== OPTION CARDS ===== */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1.5px solid var(--border);border-radius:14px;cursor:pointer;transition:border-color .18s,background .18s,transform .12s;background:#fff;-webkit-tap-highlight-color:transparent}
.opt:active{transform:scale(.98)}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-light)}
.opt-label{font-size:14.5px;font-weight:500;color:var(--text);flex:1;line-height:1.4}
.opt-sub{font-size:11.5px;color:#888;font-weight:400;margin-top:2px}
.opt-emoji{font-size:22px;margin-left:8px;flex-shrink:0}
.opt-img-l{width:56px;height:56px;border-radius:10px;object-fit:cover;margin-right:12px;flex-shrink:0;background:#f5ede0;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}

/* Checkbox */
.chk{width:22px;height:22px;border-radius:6px;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-left:8px;transition:all .18s}
.opt.sel .chk{background:var(--primary);border-color:var(--primary)}
.chk-mark{color:#fff;font-size:13px;font-weight:700;display:none}
.opt.sel .chk-mark{display:block}

/* ===== GENDER GRID ===== */
.gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.gender-card{border:1.5px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;transition:border-color .18s,transform .18s;background:#fff;-webkit-tap-highlight-color:transparent}
.gender-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.gender-card.sel{border-color:var(--primary)}
.gender-card-img{width:100%;height:175px;display:flex;align-items:center;justify-content:center;font-size:80px;background:#f5ede0}
.gender-card-img.woman{background:#f0e8d8}
.gender-card-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:700;font-size:15px;color:var(--text)}

/* ===== SIDE-IMAGE LAYOUT ===== */
.side-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.side-img-box{border-radius:18px;overflow:hidden;background:#f5ede0;aspect-ratio:.65;display:flex;align-items:center;justify-content:center;font-size:80px;position:relative}
.side-opts{display:flex;flex-direction:column;gap:9px}
.side-opts .opt{padding:10px 12px}
.side-opts .opt-label{font-size:13px}

/* ===== BUTTONS ===== */
.btn{width:100%;padding:17px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:background .18s,transform .12s;font-family:inherit;letter-spacing:.2px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-intro{text-transform:none;font-size:15.5px;padding:18px}
.mt16{margin-top:16px}

/* ===== INFO BOXES ===== */
.info-box{border-radius:14px;padding:15px 16px;margin:14px 0;font-size:13px;line-height:1.55}
.info-box .ib-title{font-weight:700;margin-bottom:5px}
.info-blue{background:#EBF5FB;border-left:4px solid #2E86C1}
.info-blue .ib-title{color:#1A5276}
.info-blue p{color:#1A5276}
.info-yellow{background:#FEF9E7;border-left:4px solid var(--yellow)}
.info-yellow .ib-title{color:#7D6608}
.info-yellow p{color:#7D6608}

/* ===== SLIDER ===== */
.slider-wrap{text-align:center;margin:16px 0}
.slider-num{font-size:54px;font-weight:900;color:var(--text);line-height:1}
.slider-unit-label{font-size:26px;font-weight:600;color:#aaa}
.unit-toggle{display:inline-flex;background:#f2f2f2;border-radius:20px;padding:3px;margin-bottom:18px}
.unit-btn{padding:6px 22px;border-radius:18px;border:none;background:none;cursor:pointer;font-weight:600;font-size:13.5px;color:#888;transition:all .2s;font-family:inherit}
.unit-btn.active{background:var(--primary);color:#fff}
.range-track{position:relative;padding:18px 0}
input[type=range].rng{-webkit-appearance:none;width:100%;height:5px;outline:none;border-radius:3px;background:#e0e0e0;cursor:pointer}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 2px 10px rgba(27,201,181,.45)}
.slider-hint{font-size:12px;color:#bbb;margin-top:6px;text-align:center}
.slider-minmax{display:flex;justify-content:space-between;font-size:11px;color:#bbb;margin-top:2px}

/* ===== AGE INPUT ===== */
.age-input{width:100%;padding:16px 18px;border:1.5px solid var(--border);border-radius:14px;font-size:17px;font-family:inherit;outline:none;color:var(--text);margin-bottom:14px;transition:border-color .2s}
.age-input:focus{border-color:var(--primary)}

/* ===== FOOD PICKER ===== */
.food-cat-title{font-size:12px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.8px;padding:8px 0 8px;border-bottom:1px solid #f5f5f5;margin-bottom:10px}
.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.food-chip{border:1.5px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;font-weight:500;cursor:pointer;transition:border-color .18s,background .18s,transform .1s;-webkit-tap-highlight-color:transparent}
.food-chip:active{transform:scale(.95)}
.food-chip.sel{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.food-chip .fc-icon{display:block;font-size:22px;margin-bottom:3px}

/* ===== SOCIAL PROOF ===== */
.sp-title{font-size:44px;font-weight:900;text-align:center}
.sp-sub{font-size:15px;text-align:center;color:var(--text);margin-bottom:8px}
.sp-sub span{color:var(--primary);font-weight:700}

/* ===== CHARTS ===== */
.chart-box{background:#fafafa;border-radius:16px;padding:16px;margin:14px 0;overflow:hidden}
canvas{max-width:100%}

/* ===== IMC BAR ===== */
.imc-track{width:100%;height:10px;border-radius:5px;background:linear-gradient(to right,#3498db 0%,#27ae60 35%,#f39c12 65%,#e74c3c 100%);position:relative;margin:10px 0}
.imc-thumb{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--primary);top:50%;transform:translateY(-50%) translateX(-50%);transition:left .4s ease;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.imc-labels{display:flex;justify-content:space-between;font-size:11px;color:#aaa}

/* ===== LOADING ===== */
.loading-bar-track{background:#e8e8e8;border-radius:8px;height:12px;overflow:hidden;margin:6px 0 10px}
.loading-bar-fill{height:100%;background:var(--primary);border-radius:8px;transition:width .45s ease}
.loading-status{font-weight:700;font-size:15px;margin-bottom:3px}
.loading-sub{font-size:12px;color:#aaa;margin-bottom:24px}

/* ===== TESTIMONIAL ===== */
.test-card{background:#F9F9FC;border:1px solid #EDEDF5;border-radius:16px;padding:16px;text-align:left;margin-bottom:12px}
.test-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.test-user{display:flex;align-items:center;gap:10px}
.test-avatar{width:42px;height:42px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.test-name{font-weight:700;font-size:13.5px;color:#333}
.test-stars{color:var(--primary);font-size:14px;font-weight:700}
.test-star-icon{color:#1BC9B5;font-size:18px}
.test-title{font-weight:800;font-size:14px;margin-bottom:6px;color:#111}
.test-body{font-size:12.5px;color:#555;line-height:1.55}

/* ===== DOTS ===== */
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#ddd;transition:background .2s}
.dot.act{background:var(--primary)}

/* ===== WEIGHT GRAPH ===== */
.graph-wrap{position:relative;background:#fff;border-radius:16px;margin:10px 0;overflow:visible;padding:8px 8px 0}
.graph-badge{position:absolute;background:#e8e8e8;border-radius:10px;padding:4px 10px;font-size:11.5px;font-weight:600;color:#555}
.graph-goal{position:absolute;right:12px;bottom:24px;background:var(--primary);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:#fff}
.graph-labels{display:flex;justify-content:space-between;font-size:11px;color:#bbb;padding:2px 4px 4px}

/* ===== SALES PAGE ===== */
#sales-page{display:none;background:#fff;max-width:430px;width:100%}
.sales-header-bar{width:100%;height:5px;background:linear-gradient(to right,var(--primary),var(--primary-dark))}
.sales-logo{text-align:center;padding:14px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;border-bottom:1px solid #f5f5f5}

/* App & AI Badge */
.app-hero-badge{background:linear-gradient(135deg,#1BC9B5,#0d9182);color:#fff;border-radius:16px;padding:16px;margin:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(27,201,181,0.25)}
.app-badge-icon{font-size:42px;flex-shrink:0}
.app-badge-txt{font-size:13px;line-height:1.4}
.app-badge-txt strong{font-size:15px;display:block;margin-bottom:2px}

.compare-wrap{background:#f5ede0;border-radius:20px;padding:18px;margin:12px 0}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare-ava{text-align:center;font-size:72px;margin-bottom:12px;line-height:1}
.compare-ava-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.compare-col-title{font-size:17px;font-weight:900;margin-bottom:12px}
.metric{margin-bottom:10px}
.metric-name{font-size:11px;color:#666;margin-bottom:2px}
.metric-val{font-size:11.5px;font-weight:700;margin-bottom:3px}
.metric-bar-track{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden}
.metric-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.fill-red{background:var(--red)}
.fill-green{background:var(--green)}
.how-box{background:#E8F8F0;border-radius:16px;padding:18px;margin:16px 0}
.how-box h3{font-size:15px;font-weight:800;margin-bottom:8px;color:#1a5c3a}
.how-box p{font-size:13px;color:#2c7a5a;line-height:1.6}
.plan-incl-title{font-size:22px;font-weight:900;text-align:center;margin:20px 0 16px}
.plan-item{padding:22px 20px;border-bottom:1px solid #f7f7f7;text-align:center}
.plan-icon{font-size:42px;margin-bottom:12px}
.plan-title{font-size:17px;font-weight:800;margin-bottom:8px;line-height:1.3}
.plan-desc{font-size:13px;color:#666;line-height:1.6}

/* Expert Card */
.expert-card{background:#FAF9FF;border:1.5px solid #E6E1FA;border-radius:20px;padding:20px;margin:24px 20px;text-align:center}
.expert-avatar{width:90px;height:90px;border-radius:50%;background:#e0f5e8;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:48px;border:3px solid var(--primary)}
.expert-name{font-size:18px;font-weight:900;color:#111;margin-bottom:2px}
.expert-title{font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.expert-bio{font-size:13px;color:#555;line-height:1.6}

/* FAQ Accordion */
.faq-wrap{padding:0 20px;margin:24px 0}
.faq-item{border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;background:#fff}
.faq-q{padding:16px;font-size:14px;font-weight:700;color:#222;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.faq-q span{color:var(--primary);font-size:18px;transition:transform .2s}
.faq-item.open .faq-q span{transform:rotate(45deg)}
.faq-a{padding:0 16px 16px;font-size:13px;color:#555;line-height:1.6;display:none;border-top:1px solid #f5f5f5}
.faq-item.open .faq-a{display:block}

.price-badge{background:var(--primary);color:#fff;border-radius:12px 12px 0 0;padding:13px 16px;text-align:center;font-size:13px;font-weight:600}
.price-card{border:2px solid var(--primary);border-radius:0 0 12px 12px;padding:16px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.price-product{font-weight:700;font-size:14px;line-height:1.4}
.price-val{text-align:right}
.price-install{font-size:14px;font-weight:800;color:var(--primary)}
.price-full{font-size:11.5px;color:#aaa}
.trust{display:flex;justify-content:center;gap:20px;margin-top:14px;padding-bottom:8px}
.trust-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#555;text-align:center}
.trust-icon{font-size:22px}
.cta-btn{width:100%;padding:20px;background:var(--primary);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;margin-top:16px;font-family:inherit;letter-spacing:.3px;transition:background .18s,transform .12s;text-transform:uppercase}
.cta-btn:hover{background:var(--primary-dark)}
.cta-btn:active{transform:scale(.98)}

/* Gallery of Transformation Photos */
.photos-grid{display:flex;flex-direction:column;gap:16px;padding:0 20px;margin:20px 0}
.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-radius:16px;overflow:hidden;background:#f5ede0;height:240px;position:relative}
.photo-card{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;position:relative;background:#f0e8d8}
.photo-card.after{background:#e0f5e8}
.photo-tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;color:#fff}
.tag-before{background:var(--red)}
.tag-after{background:var(--green)}

/* Guarantee Box */
.guarantee-box{text-align:center;padding:24px 20px;margin:24px 0 10px;background:#fff;border-top:1px solid #f0f0f0}
.guarantee-seal{width:110px;height:110px;margin:0 auto 14px;background:#fcf4d4;border:4px dashed var(--yellow);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b58105;font-weight:900;line-height:1.1}
.guarantee-seal span{font-size:28px}
.guarantee-seal small{font-size:9px;letter-spacing:1px}
.guarantee-title{font-size:19px;font-weight:900;margin-bottom:10px;color:#111}
.guarantee-desc{font-size:13px;color:#666;line-height:1.6;margin-bottom:14px}
.guarantee-email{font-weight:700;color:#333;background:#f5f5f5;padding:4px 10px;border-radius:6px;font-size:12.5px;display:inline-block}

/* ===== INFO SCREENS ===== */
.info-big-title{font-size:21px;font-weight:900;line-height:1.3;text-align:center;margin-bottom:14px}
.info-body-text{font-size:13.5px;color:#555;line-height:1.65;text-align:center;margin-bottom:16px}
.face-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;border-radius:16px;overflow:hidden}
.face-card{border-radius:14px;height:150px;display:flex;align-items:center;justify-content:center;font-size:54px}

/* ===== RESULT SCREEN ===== */
.result-target{font-size:16px;font-weight:900;text-align:center;margin:6px 0 14px}

/* ===== SCROLLBAR HIDE ===== */
::-webkit-scrollbar{width:0;height:0}

/* ===== MOBILE ===== */
@media(min-width:431px){#app,#sales-page{box-shadow:0 0 40px rgba(0,0,0,.12)}}
</style>
</head>
<body>
<div id="app">
  <div id="quiz-section">
    <div class="quiz-header" id="hdr">
      <button class="btn-back" id="btnBack" onclick="goBack()">←</button>
      <div class="logo">🔥 SECA JEJUM</div>
    </div>
    <div class="progress-bar-wrap" id="pbWrap">
      <div class="progress-bar-fill" id="pbFill" style="width:0%"></div>
    </div>
    <div class="step-wrap" id="stepWrap"></div>
  </div>
  <div id="sales-page"></div>
</div>

<script>
let currentStep = 0;
let goingBack = false;
const ud = {
  gender:'mulher', ageRange:null, goal:null, bodyType:null, targetBody:null,
  focusAreas:[], lastBestShape:null, bodyDescription:null, ifKnowledge:null,
  breakfast:null, lunch:null, dinner:null, dietaryRestrictions:[], dislikedFoods:[],
  mealPreference:null, weekendBreak:null, exerciseFrequency:null, workRoutine:null,
  sleepHours:null, waterIntake:null, physicalProblems:[], weightGainEvents:[],
  height:165, currentWeight:70, targetWeight:60, exactAge:null, upcomingEvent:null,
  heightUnit:'cm', weightUnit:'kg'
};

const STEPS = [
  {id:'intro',    type:'intro'},
  {id:'gender',   type:'gender'},
  {id:'age',      type:'single', q:'Ajuste o seu plano de acordo com\na sua idade', key:'ageRange',
    opts:[{l:'18 a 25 anos',e:'👩'},{l:'26 a 35 anos',e:'👩‍🦱'},{l:'36 a 45 anos',e:'👩‍🦳'},{l:'+46 anos',e:'👩‍🦲'}]},
  {id:'social1',  type:'info-social'},
  {id:'goal',     type:'single', q:'Qual é o seu objetivo principal?', key:'goal',
    opts:[{l:'Perder peso',e:'🏃‍♀️'},{l:'Ficar em forma',e:'💪'},{l:'Melhorar a saúde do coração',e:'❤️‍🩺'},{l:'Aliviar o estresse',e:'🧘‍♀️'}]},
  {id:'bodytype', type:'single', q:'Como você descreveria seu físico?', key:'bodyType',
    opts:[{l:'Magra',e:'🟢'},{l:'Falsa magra',e:'🟡'},{l:'Sobrepeso',e:'🟠'},{l:'Obesa',e:'🔴'}]},
  {id:'info-chart1', type:'info-chart1'},
  {id:'targetbody',type:'single', q:'Qual corpo você deseja alcançar?', key:'targetBody',
    opts:[{l:'Curvilínea',e:'🌟'},{l:'Magra',e:'✨'},{l:'Normal',e:'🙂'},{l:'Em forma',e:'💪'},{l:'Cheia',e:'😊'}]},
  {id:'focusareas',type:'multi-card', q:'Quais áreas do corpo você quer\nfocar?', key:'focusAreas',
    opts:[{l:'Barriga',e:'🫁'},{l:'Bunda',e:'🍑'},{l:'Peito',e:'💙'},{l:'Pernas',e:'🦵'}]},
  {id:'lastshape', type:'single', q:'Faz quanto tempo que você se\nsentiu na sua melhor forma?', key:'lastBestShape',
    layout:'side', img:'👸',
    opts:[{l:'0 a 6 meses atrás'},{l:'7 a 12 meses atrás'},{l:'1 a 3 anos atrás'},{l:'Mais de 3 anos atrás'}]},

const QUESTION_IDS = STEPS.filter(s=>['single','multi','multi-card','slider','age-input','food-picker'].includes(s.type)).map(s=>s.id);
const TOTAL_Q = QUESTION_IDS.length;

function render(){
  const step = STEPS[currentStep];
  const wrap = document.getElementById('stepWrap');
  const pbWrap = document.getElementById('pbWrap');
  const pbFill = document.getElementById('pbFill');
  const back = document.getElementById('btnBack');

  if(step.type === 'intro' || step.type === 'gender'){
    pbWrap.style.display = 'none';
    back.style.display = 'none';
  } else {
    pbWrap.style.display = 'block';
    back.style.display = (currentStep > 1) ? 'block' : 'none';
    const qIdx = QUESTION_IDS.indexOf(step.id);
    const pct = qIdx >= 0 ? Math.round(((qIdx+1)/TOTAL_Q)*100) : Math.min(98, Math.round((currentStep/STEPS.length)*100));
    pbFill.style.width = pct + '%';
  }

  wrap.className = 'step-wrap ' + (goingBack ? 'anim-back' : 'anim-in');
  goingBack = false;

  switch(step.type){
    case 'intro':          wrap.innerHTML = renderIntro(); break;
    case 'gender':         wrap.innerHTML = renderGender(); break;
    case 'single':         wrap.innerHTML = renderSingle(step); break;
    case 'multi':          wrap.innerHTML = renderMulti(step); break;
    case 'multi-card':     wrap.innerHTML = renderMultiCard(step); break;
    case 'slider':         wrap.innerHTML = renderSlider(step); postSlider(step); break;
    case 'age-input':      wrap.innerHTML = renderAgeInput(step); break;
    case 'food-picker':    wrap.innerHTML = renderFoodPicker(); break;
    case 'info-social':    wrap.innerHTML = renderInfoSocial(); break;
    case 'info-chart1':    wrap.innerHTML = renderInfoChart1(); setTimeout(drawChart1,80); break;
    case 'info-metabolism':wrap.innerHTML = renderInfoMetabolism(); setTimeout(drawMetabolism,80); break;
    case 'info-face':      wrap.innerHTML = renderInfoFace(); break;
    case 'imc-summary':    wrap.innerHTML = renderIMCSummary(); break;
    case 'weight-graph':   wrap.innerHTML = renderWeightGraphScreen(); setTimeout(()=>drawWeightGraph('wgcanvas'),100); break;
    case 'loading':        wrap.innerHTML = renderLoading(); startLoading(); break;
    case 'result':         wrap.innerHTML = renderResult(); setTimeout(()=>drawWeightGraph('rcanvas'),100); break;
    default: wrap.innerHTML = '<p>Step not found</p>';
  }
  window.scrollTo(0,0);
}

function next(){ if(currentStep < STEPS.length-1){ currentStep++; render(); } }
function goBack(){ if(currentStep > 0){ goingBack=true; currentStep--; render(); } }

function drawWeightGraph(id){
  const c=document.getElementById(id); if(!c) return;
  const ctx=c.getContext('2d');
  c.width=c.offsetWidth||380; const W=c.width,H=c.height,P=20;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#f0f0f0'; ctx.lineWidth=1;
  for(let i=0;i<4;i++){ const y=P+i*((H-2*P)/3); ctx.beginPath(); ctx.moveTo(P,y); ctx.lineTo(W-P,y); ctx.stroke(); }
  const pts=[];
  for(let i=0;i<8;i++){
    const t=i/7;
    const x=P+t*(W-2*P);
    const y=P+(1-t)*(1-t)*0.85*(H-2*P)+P*0.2+Math.sin(i*1.8)*5;
    pts.push({x,y});
  }
  const ag=ctx.createLinearGradient(0,P,0,H-P);
  ag.addColorStop(0,'rgba(231,76,60,0.25)'); ag.addColorStop(.5,'rgba(243,156,18,0.15)'); ag.addColorStop(1,'rgba(39,174,96,0.08)');
  ctx.beginPath(); ctx.moveTo(pts[0].x,H-P); ctx.lineTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){ const c1x=(pts[i-1].x+pts[i].x)/2; ctx.bezierCurveTo(c1x,pts[i-1].y,c1x,pts[i].y,pts[i].x,pts[i].y); }
  ctx.lineTo(pts[pts.length-1].x,H-P); ctx.closePath(); ctx.fillStyle=ag; ctx.fill();
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){ const c1x=(pts[i-1].x+pts[i].x)/2; ctx.bezierCurveTo(c1x,pts[i-1].y,c1x,pts[i].y,pts[i].x,pts[i].y); }
  ctx.strokeStyle='#555'; ctx.lineWidth=2; ctx.stroke();
  const cols=['#e74c3c','#e74c3c','#e67e22','#f39c12','#f39c12','#27ae60','#27ae60','#27ae60'];
  pts.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fillStyle=cols[i]; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke(); });
}

function drawChart1(){
  const c=document.getElementById('c1'); if(!c) return;
  const ctx=c.getContext('2d'); c.width=c.offsetWidth||360;
  const W=c.width,H=c.height,P=16;
  ctx.clearRect(0,0,W,H);
  const bw=52,gap=W/4;
  function drawBar(x,bH,c1,c2,lbl){
    const top=H-P-bH;
    const g=ctx.createLinearGradient(0,top,0,H-P);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.beginPath(); ctx.roundRect(x,top,bw,bH,6); ctx.fillStyle=g; ctx.fill();
    const chipY=top-22;
    ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.roundRect(x-4,chipY,bw+8,18,4); ctx.fill();
    ctx.fillStyle='#333'; ctx.font='bold 9px Inter'; ctx.textAlign='center'; ctx.fillText(lbl,x+bw/2,chipY+12);
  }
  drawBar(gap-bw/2,0.68*(H-P*2),'#ff9999','#e74c3c','CALORIAS VAZIAS ☠️ ↑');
  drawBar(3*gap-bw/2,0.75*(H-P*2),'#80ede5','#1BC9B5','ENERGIA ⚡ ↑');
  ctx.strokeStyle='var(--primary)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(2*gap-18,H/2); ctx.lineTo(2*gap+18,H/2);
  ctx.moveTo(2*gap+10,H/2-7); ctx.lineTo(2*gap+18,H/2); ctx.lineTo(2*gap+10,H/2+7); ctx.stroke();
  ctx.fillStyle='#555'; ctx.font='10px Inter'; ctx.textAlign='center';
  ctx.fillText('HOJE',gap,H-2); ctx.fillText('DEPOIS',3*gap,H-2);
}

function drawMetabolism(){
  const c=document.getElementById('cmet'); if(!c) return;
  const ctx=c.getContext('2d'); c.width=c.offsetWidth||360;
  const W=c.width,H=c.height,P=24,N=8,BW=(W-2*P)/(N*1.8);
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<N;i++){
    const x=P+i*(W-2*P)/N+2;
    const bH=(0.4+0.45*Math.sin(i/N*Math.PI+.3))*(H-P*2);
    const g=ctx.createLinearGradient(0,H-P-bH,0,H-P);
    g.addColorStop(0,'#f7dc6f'); g.addColorStop(1,'#f39c12');
    ctx.beginPath(); ctx.roundRect(x,H-P-bH,BW,bH,4); ctx.fillStyle=g; ctx.fill();
  }
  const pp=[];
  for(let i=0;i<=N;i++){ const t=i/N; pp.push({x:P+t*(W-2*P),y:P+(0.35+0.4*Math.sin(t*Math.PI*.7+.6))*(H-P*2)}); }
  ctx.beginPath(); ctx.moveTo(pp[0].x,pp[0].y);
  pp.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pp[N].x,H-P); ctx.lineTo(pp[0].x,H-P); ctx.fillStyle='rgba(231,76,60,.12)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(pp[0].x,pp[0].y); pp.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle='#e74c3c'; ctx.lineWidth=2.5; ctx.stroke();
  const lx1=P+4,ly1=H-P-0.55*(H-P*2)-16;
  ctx.fillStyle='rgba(27,201,181,.15)'; ctx.beginPath(); ctx.roundRect(lx1,ly1,84,18,4); ctx.fill();
  ctx.fillStyle='#0d8a7a'; ctx.font='bold 10px Inter'; ctx.textAlign='left'; ctx.fillText('Metabolismo',lx1+4,ly1+13);
  ctx.fillStyle='rgba(231,76,60,.15)'; ctx.beginPath(); ctx.roundRect(W-P-60,P+4,56,18,4); ctx.fill();
  ctx.fillStyle='#c0392b'; ctx.textAlign='right'; ctx.fillText('Peso',W-P-6,P+17);
}
