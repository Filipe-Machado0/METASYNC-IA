<style>
/* ===== RESET & ROOT ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:#06080A}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#06080A;color:#E1E7ED;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}

:root{
  --bg-deep:#0D0D0D;
  --bg-card:rgba(18, 24, 32, 0.65);
  --cyan-neon:#00F2FF;
  --cyan-glow:rgba(0, 242, 255, 0.35);
  --cyan-dark:#008B99;
  --cyan-light:rgba(0, 242, 255, 0.1);
  --silver:#A0AAB0;
  --silver-light:#D0D8DF;
  --border-glass:rgba(0, 242, 255, 0.18);
  --border-subtle:rgba(255, 255, 255, 0.08);
  --red-neon:#FF3B5C;
  --green-neon:#00FF87;
  --yellow-neon:#FFB800;
}

/* ===== BACKGROUND FX ===== */
body::before{
  content:'';position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:radial-gradient(circle at 50% 15%, rgba(0, 242, 255, 0.08) 0%, rgba(13, 13, 13, 0) 70%),
             radial-gradient(circle at 80% 75%, rgba(0, 255, 135, 0.04) 0%, rgba(13, 13, 13, 0) 60%);
  pointer-events:none;z-index:0;
}

/* ===== APP SHELL ===== */
#app{width:100%;max-width:440px;min-height:100vh;background:var(--bg-deep);position:relative;overflow-x:hidden;z-index:1;box-shadow:0 0 50px rgba(0, 242, 255, 0.12);border-left:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column}

/* ===== HEADER ===== */
.quiz-header{display:flex;align-items:center;justify-content:center;padding:16px;position:relative;background:rgba(13, 13, 13, 0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-glass)}
.btn-back{position:absolute;left:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--silver);padding:4px 8px;line-height:1;display:none;transition:color .2s}
.btn-back:hover{color:var(--cyan-neon)}
.logo{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:6px;text-shadow:0 0 14px var(--cyan-glow)}
.logo-badge{background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#06080A;font-size:10px;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:0.5px}

/* ===== PROGRESS ===== */
.progress-bar-wrap{width:100%;height:3px;background:rgba(255,255,255,0.06);display:none;position:relative}
.progress-bar-fill{height:100%;background:linear-gradient(to right,var(--cyan-dark),var(--cyan-neon));transition:width .45s ease;box-shadow:0 0 10px var(--cyan-neon)}

/* ===== STEP CONTAINER ===== */
.step-wrap{padding:24px 20px 40px;min-height:calc(100vh - 75px);display:flex;flex-direction:column}
.step-wrap.anim-in{animation:fadeIn .35s ease}
.step-wrap.anim-back{animation:fadeInLeft .35s ease}

@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInLeft{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* ===== SYNC LOADER ===== */
.sync-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(13,13,13,0.88);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;animation:fadeIn .2s ease}
.sync-spinner{width:48px;height:48px;border:3px solid rgba(0,242,255,0.15);border-top:3px solid var(--cyan-neon);border-radius:50%;animation:spin .6s linear infinite;box-shadow:0 0 15px var(--cyan-glow)}
.sync-text{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--cyan-neon);margin-top:16px;text-transform:uppercase;text-shadow:0 0 10px var(--cyan-glow)}

@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* ===== TYPOGRAPHY ===== */
.q-title{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:#fff;line-height:1.35;margin-bottom:22px;white-space:pre-line;letter-spacing:-0.2px}
.q-title.center{text-align:center}
.q-sub{font-size:13.5px;color:var(--silver);line-height:1.6;margin-bottom:20px;letter-spacing:0.3px}

/* ===== GLASS CARDS & OPTIONS ===== */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:16px;cursor:pointer;transition:all .2s ease;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:var(--cyan-neon);box-shadow:0 0 20px var(--cyan-light);transform:translateY(-1px)}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--cyan-neon);background:rgba(0, 242, 255, 0.08);box-shadow:0 0 25px var(--cyan-glow)}
.opt-label{font-size:15px;font-weight:600;color:#F0F5FA;flex:1;line-height:1.4}
.opt-sub{font-size:12px;color:var(--silver);font-weight:400;margin-top:3px}
.opt-emoji{font-size:24px;margin-left:10px;flex-shrink:0}
.opt-img-l{width:56px;height:56px;border-radius:12px;object-fit:cover;margin-right:14px;flex-shrink:0;background:rgba(255,255,255,0.04);border:1px solid var(--border-glass);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}

/* Neon Checkbox */
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--silver);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-left:10px;transition:all .2s}
.opt.sel .chk{background:var(--cyan-neon);border-color:var(--cyan-neon);box-shadow:0 0 10px var(--cyan-neon)}
.chk-mark{color:#06080A;font-size:13px;font-weight:900;display:none}
.opt.sel .chk-mark{display:block}

/* ===== GENDER GRID ===== */
.gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.gender-card{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:20px;overflow:hidden;cursor:pointer;transition:all .25s ease;-webkit-tap-highlight-color:transparent}
.gender-card:hover{border-color:var(--cyan-neon);box-shadow:0 0 25px var(--cyan-glow);transform:translateY(-3px)}
.gender-card.sel{border-color:var(--cyan-neon);box-shadow:0 0 30px var(--cyan-glow)}
.gender-card-img{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:82px;background:rgba(255,255,255,0.02)}
.gender-card-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#fff}

/* ===== SIDE-IMAGE LAYOUT ===== */
.side-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
.side-img-box{border-radius:20px;overflow:hidden;background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);aspect-ratio:.68;display:flex;align-items:center;justify-content:center;font-size:84px;position:relative}
.side-opts{display:flex;flex-direction:column;gap:10px}
.side-opts .opt{padding:12px 14px}
.side-opts .opt-label{font-size:13.5px}

/* ===== BUTTONS ===== */
.btn{width:100%;padding:18px;border:none;border-radius:16px;font-family:'Montserrat',sans-serif;font-size:15.5px;font-weight:800;cursor:pointer;transition:all .2s ease;letter-spacing:0.5px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#06080A;box-shadow:0 0 20px var(--cyan-glow)}
.btn-primary:hover{box-shadow:0 0 30px rgba(0, 242, 255, 0.6);transform:translateY(-1px)}
.btn-intro{text-transform:uppercase;font-size:15px;padding:20px}
.mt16{margin-top:16px}

/* ===== GLASS INFO BOXES ===== */
.info-box{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin:16px 0;font-size:13.5px;line-height:1.6}
.info-box .ib-title{font-weight:800;font-size:14px;margin-bottom:6px}
.info-blue{border-left:4px solid var(--cyan-neon);background:rgba(0, 242, 255, 0.06)}
.info-blue .ib-title{color:var(--cyan-neon)}
.info-blue p{color:var(--silver-light)}
.info-yellow{border-left:4px solid var(--yellow-neon);background:rgba(255, 184, 0, 0.06)}
.info-yellow .ib-title{color:var(--yellow-neon)}
.info-yellow p{color:var(--silver-light)}

/* ===== SLIDER ===== */
.slider-wrap{text-align:center;margin:20px 0}
.slider-num{font-family:'Montserrat',sans-serif;font-size:56px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 15px var(--cyan-glow)}
.slider-unit-label{font-size:24px;font-weight:600;color:var(--silver);margin-left:4px}
.unit-toggle{display:inline-flex;background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);border-radius:24px;padding:4px;margin-bottom:20px}
.unit-btn{padding:7px 24px;border-radius:20px;border:none;background:none;cursor:pointer;font-weight:700;font-size:13px;color:var(--silver);transition:all .2s;font-family:inherit}
.unit-btn.active{background:var(--cyan-neon);color:#06080A;box-shadow:0 0 12px var(--cyan-glow)}
.range-track{position:relative;padding:20px 0}
input[type=range].rng{-webkit-appearance:none;width:100%;height:6px;outline:none;border-radius:4px;background:rgba(255,255,255,0.1);cursor:pointer}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--cyan-neon);cursor:pointer;box-shadow:0 0 15px var(--cyan-neon)}
.slider-hint{font-size:12px;color:var(--silver);margin-top:8px;text-align:center;letter-spacing:0.5px}
.slider-minmax{display:flex;justify-content:space-between;font-size:11px;color:var(--silver);margin-top:4px}

/* ===== AGE INPUT ===== */
.age-input{width:100%;padding:18px;background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:16px;font-size:18px;font-family:inherit;outline:none;color:#fff;margin-bottom:16px;transition:all .2s;text-align:center}
.age-input:focus{border-color:var(--cyan-neon);box-shadow:0 0 20px var(--cyan-glow)}

/* ===== FOOD PICKER ===== */
.food-cat-title{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;color:var(--cyan-neon);text-transform:uppercase;letter-spacing:1px;padding:10px 0 6px;margin-bottom:8px;border-bottom:1px solid var(--border-subtle)}
.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.food-chip{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s ease;-webkit-tap-highlight-color:transparent;color:var(--silver-light)}
.food-chip:active{transform:scale(.95)}
.food-chip.sel{border-color:var(--cyan-neon);background:rgba(0, 242, 255, 0.12);color:var(--cyan-neon);box-shadow:0 0 15px var(--cyan-glow)}
.food-chip .fc-icon{display:block;font-size:22px;margin-bottom:4px}

/* ===== SOCIAL PROOF ===== */
.sp-title{font-family:'Montserrat',sans-serif;font-size:46px;font-weight:900;text-align:center;color:#fff;text-shadow:0 0 20px var(--cyan-glow)}
.sp-sub{font-size:15px;text-align:center;color:var(--silver);margin-bottom:10px}
.sp-sub span{color:var(--cyan-neon);font-weight:700}

/* ===== CHARTS ===== */
.chart-box{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:20px;padding:16px;margin:16px 0;overflow:hidden}
canvas{max-width:100%}

/* ===== IMC BAR ===== */
.imc-track{width:100%;height:10px;border-radius:5px;background:linear-gradient(to right,#3498db 0%,var(--green-neon) 35%,var(--yellow-neon) 65%,var(--red-neon) 100%);position:relative;margin:12px 0}
.imc-thumb{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--cyan-neon);top:50%;transform:translateY(-50%) translateX(-50%);transition:left .4s ease;box-shadow:0 0 12px var(--cyan-neon)}
.imc-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--silver)}

/* ===== LOADING ===== */
.loading-bar-track{background:rgba(255,255,255,0.06);border-radius:8px;height:12px;overflow:hidden;margin:8px 0 12px;border:1px solid var(--border-subtle)}
.loading-bar-fill{height:100%;background:linear-gradient(to right,var(--cyan-dark),var(--cyan-neon));border-radius:8px;transition:width .45s ease;box-shadow:0 0 12px var(--cyan-glow)}
.loading-status{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;color:#fff;margin-bottom:4px}
.loading-sub{font-size:12.5px;color:var(--silver);margin-bottom:24px}

/* ===== TESTIMONIAL CARDS ===== */
.test-card{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:18px;padding:18px;text-align:left;margin-bottom:14px}
.test-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.test-user{display:flex;align-items:center;gap:12px}
.test-avatar{width:44px;height:44px;border-radius:50%;background:rgba(0, 242, 255, 0.1);border:1px solid var(--cyan-neon);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.test-name{font-weight:700;font-size:14px;color:#fff}
.test-stars{color:var(--cyan-neon);font-size:14px;font-weight:700}
.test-star-icon{color:var(--cyan-neon);font-size:18px;text-shadow:0 0 8px var(--cyan-glow)}
.test-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px;margin-bottom:6px;color:#fff}
.test-body{font-size:13px;color:var(--silver-light);line-height:1.6}

/* ===== WEIGHT GRAPH ===== */
.graph-wrap{position:relative;background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:20px;margin:14px 0;overflow:visible;padding:10px 10px 0}
.graph-badge{position:absolute;background:rgba(255,255,255,0.08);border:1px solid var(--border-subtle);border-radius:10px;padding:4px 12px;font-size:11.5px;font-weight:700;color:var(--silver-light)}
.graph-goal{position:absolute;right:14px;bottom:26px;background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));border-radius:8px;padding:5px 12px;font-size:12px;font-weight:900;color:#06080A;box-shadow:0 0 15px var(--cyan-glow)}
.graph-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--silver);padding:4px 6px 6px}

/* ===== SALES PAGE (DASHBOARD LAB AESTHETIC) ===== */
#sales-page{display:none;background:var(--bg-deep);max-width:440px;width:100%}
.sales-header-bar{width:100%;height:3px;background:linear-gradient(to right,var(--cyan-dark),var(--cyan-neon),var(--green-neon));box-shadow:0 0 12px var(--cyan-glow)}
.sales-logo{text-align:center;padding:16px;font-family:'Montserrat',sans-serif;font-size:16px;font-weight:900;letter-spacing:1.5px;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid var(--border-subtle)}

/* Cyberpunk App & AI Hero Banner */
.app-hero-badge{background:linear-gradient(135deg, rgba(0, 242, 255, 0.15), rgba(0, 139, 153, 0.25));border:1px solid var(--cyan-neon);backdrop-filter:blur(16px);border-radius:20px;padding:18px;margin:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 0 25px var(--cyan-glow)}
.app-badge-icon{font-size:46px;flex-shrink:0;filter:drop-shadow(0 0 8px var(--cyan-neon))}
.app-badge-txt{font-size:13px;line-height:1.45;color:var(--silver-light)}
.app-badge-txt strong{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:800;color:#fff;display:block;margin-bottom:3px}

.compare-wrap{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:22px;padding:20px;margin:14px 0}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare-ava{text-align:center;font-size:74px;margin-bottom:12px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,255,255,0.1))}
.compare-ava-label{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;color:var(--cyan-neon);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.compare-col-title{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:900;color:#fff;margin-bottom:14px}
.metric{margin-bottom:12px}
.metric-name{font-size:11px;color:var(--silver);margin-bottom:3px}
.metric-val{font-size:12px;font-weight:800;margin-bottom:4px}
.metric-bar-track{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.metric-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.fill-red{background:linear-gradient(to right,#ff6b81,var(--red-neon));box-shadow:0 0 8px var(--red-neon)}
.fill-green{background:linear-gradient(to right,var(--cyan-dark),var(--green-neon));box-shadow:0 0 8px var(--green-neon)}

.how-box{background:rgba(0, 255, 135, 0.05);border:1px solid rgba(0, 255, 135, 0.2);backdrop-filter:blur(12px);border-radius:18px;padding:20px;margin:18px 0}
.how-box h3{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;margin-bottom:8px;color:var(--green-neon)}
.how-box p{font-size:13.5px;color:var(--silver-light);line-height:1.65}

.plan-incl-title{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:900;text-align:center;color:#fff;margin:24px 0 18px;letter-spacing:-0.3px}

.plan-item{padding:22px 20px;border-bottom:1px solid var(--border-subtle);text-align:center}
.plan-icon{font-size:44px;margin-bottom:12px;filter:drop-shadow(0 0 10px var(--cyan-glow))}
.plan-title{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:800;color:#fff;margin-bottom:8px;line-height:1.35}
.plan-desc{font-size:13.5px;color:var(--silver-light);line-height:1.6}

/* Expert Card */
.expert-card{background:linear-gradient(135deg, rgba(20, 25, 35, 0.7), rgba(10, 15, 20, 0.9));border:1px solid var(--cyan-neon);backdrop-filter:blur(16px);border-radius:24px;padding:22px;margin:26px 20px;text-align:center;box-shadow:0 0 30px var(--cyan-light)}
.expert-avatar{width:96px;height:96px;border-radius:50%;background:rgba(0, 242, 255, 0.1);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:52px;border:2px solid var(--cyan-neon);box-shadow:0 0 20px var(--cyan-glow);overflow:hidden}
.expert-name{font-family:'Montserrat',sans-serif;font-size:19px;font-weight:900;color:#fff;margin-bottom:3px}
.expert-title{font-size:11.5px;font-weight:800;color:var(--cyan-neon);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.expert-bio{font-size:13px;color:var(--silver-light);line-height:1.65}

/* FAQ Accordion */
.faq-wrap{padding:0 20px;margin:24px 0}
.faq-item{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:16px;margin-bottom:12px;overflow:hidden}
.faq-q{padding:18px 16px;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.faq-q span{color:var(--cyan-neon);font-size:20px;transition:transform .25s ease;text-shadow:0 0 8px var(--cyan-glow)}
.faq-item.open .faq-q span{transform:rotate(45deg)}
.faq-a{padding:0 16px 18px;font-size:13px;color:var(--silver-light);line-height:1.65;display:none;border-top:1px solid var(--border-subtle)}
.faq-item.open .faq-a{display:block}

/* Pricing Card */
.price-badge{background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#06080A;border-radius:14px 14px 0 0;padding:14px 16px;text-align:center;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:900;letter-spacing:0.5px}
.price-card{background:var(--bg-card);border:2px solid var(--cyan-neon);border-top:none;border-radius:0 0 16px 16px;padding:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 25px var(--cyan-light)}
.price-product{font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px;color:#fff;line-height:1.4}
.price-val{text-align:right}
.price-install{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:900;color:var(--cyan-neon);text-shadow:0 0 10px var(--cyan-glow)}
.price-full{font-size:11.5px;color:var(--silver)}
.trust{display:flex;justify-content:center;gap:20px;margin-top:16px;padding-bottom:8px}
.trust-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--silver);text-align:center}
.trust-icon{font-size:24px}
.cta-btn{width:100%;padding:22px;background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#06080A;border:none;border-radius:16px;font-family:'Montserrat',sans-serif;font-size:16px;font-weight:900;cursor:pointer;margin-top:18px;letter-spacing:0.8px;transition:all .2s ease;text-transform:uppercase;box-shadow:0 0 25px var(--cyan-glow)}
.cta-btn:hover{box-shadow:0 0 35px rgba(0, 242, 255, 0.7);transform:translateY(-2px)}
.cta-btn:active{transform:scale(.98)}

/* Gallery of Transformation Photos */
.photos-grid{display:flex;flex-direction:column;gap:16px;padding:0 20px;margin:20px 0}
.photo-pair-img{width:100%;border-radius:18px;overflow:hidden;background:var(--bg-card);border:1px solid var(--border-glass);position:relative}
.photo-pair-img img{width:100%;height:auto;display:block;object-fit:cover;border-radius:18px}
.photo-tag-left{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;color:#fff;text-transform:uppercase;letter-spacing:0.5px;background:var(--red-neon);box-shadow:0 0 8px var(--red-neon);z-index:2}
.photo-tag-right{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;color:#06080A;text-transform:uppercase;letter-spacing:0.5px;background:var(--green-neon);box-shadow:0 0 8px var(--green-neon);z-index:2}

/* Guarantee Box */
.guarantee-box{text-align:center;padding:28px 20px;margin:28px 0 10px;background:var(--bg-card);border-top:1px solid var(--border-glass)}
.guarantee-seal{width:115px;height:115px;margin:0 auto 16px;background:rgba(255, 184, 0, 0.08);border:2px dashed var(--yellow-neon);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--yellow-neon);font-weight:900;line-height:1.1;box-shadow:0 0 20px rgba(255, 184, 0, 0.15)}
.guarantee-seal span{font-size:30px}
.guarantee-seal small{font-size:9px;letter-spacing:1px}
.guarantee-title{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:900;margin-bottom:10px;color:#fff}
.guarantee-desc{font-size:13.5px;color:var(--silver-light);line-height:1.65;margin-bottom:16px}
.guarantee-email{font-weight:700;color:var(--cyan-neon);background:rgba(0, 242, 255, 0.08);border:1px solid var(--border-glass);padding:6px 14px;border-radius:8px;font-size:13px;display:inline-block}

/* ===== SCROLLBAR HIDE ===== */
::-webkit-scrollbar{width:0;height:0}

/* ===== SOCIAL PROOF TOAST ===== */
#socialToast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:408px;background:rgba(18,24,32,0.96);border:1.5px solid var(--cyan-neon);backdrop-filter:blur(16px);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 0 25px rgba(0,242,255,0.3);z-index:9999;opacity:0;pointer-events:none;transition:opacity .4s ease, transform .4s ease}
#socialToast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#06080A;flex-shrink:0}
.toast-body{font-size:12px;color:#fff;line-height:1.35}
.toast-body strong{color:var(--cyan-neon)}
.toast-time{font-size:10px;color:var(--silver);margin-top:2px}

/* ===== INTERACTIVE DEMO APP WIDGET ===== */
.demo-container{background:var(--bg-card);border:1.5px solid var(--border-glass);backdrop-filter:blur(16px);border-radius:24px;margin:20px;padding:18px;box-shadow:0 0 30px rgba(0,242,255,0.12);overflow:hidden}
.demo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border-subtle)}
.demo-title{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.demo-title-badge{background:rgba(0,242,255,0.15);color:var(--cyan-neon);border:1px solid var(--cyan-neon);font-size:9px;font-weight:900;padding:2px 7px;border-radius:20px;letter-spacing:0.5px}
.demo-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(0,0,0,0.5);padding:6px;border-radius:18px;border:1px solid var(--border-glass);margin-bottom:16px}
.demo-tab{width:100%;padding:10px 4px;font-size:11.5px;font-weight:700;color:var(--silver);background:rgba(255,255,255,0.03);border:1px solid transparent;border-radius:14px;cursor:pointer;transition:all .25s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;box-sizing:border-box}
.demo-tab:hover{background:rgba(255,255,255,0.08);color:#fff}
.demo-tab.active{background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#06080A;box-shadow:0 0 16px var(--cyan-glow);font-weight:900;border-color:var(--cyan-neon)}
.demo-tab-icon{font-size:18px;line-height:1}
.demo-tab-label{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;letter-spacing:0.2px}

.demo-pane{display:none;animation:fadeIn .3s ease}
.demo-pane.active{display:block}

/* Chat Pane */
.demo-chat-box{background:rgba(6,8,10,0.7);border:1px solid var(--border-subtle);border-radius:16px;padding:12px;min-height:160px;max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.demo-msg{display:flex;gap:8px;align-items:flex-start}
.demo-msg.user{flex-direction:row-reverse}
.demo-msg-avatar{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--cyan-neon);background:#111;display:flex;align-items:center;justify-content:center;font-size:14px}
.demo-msg-bubble{max-width:82%;padding:9px 12px;border-radius:14px;font-size:12px;line-height:1.45}
.demo-msg.ai .demo-msg-bubble{background:rgba(0,242,255,0.1);border:1px solid var(--border-glass);color:var(--silver-light)}
.demo-msg.user .demo-msg-bubble{background:var(--cyan-neon);color:#06080A;font-weight:600}
.demo-quick-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.demo-chip{background:rgba(255,255,255,0.06);border:1px solid var(--border-glass);color:var(--cyan-neon);font-size:10.5px;font-weight:600;padding:6px 10px;border-radius:20px;cursor:pointer;transition:all .2s}
.demo-chip:hover{background:rgba(0,242,255,0.15);border-color:var(--cyan-neon)}

/* Fasting Stage Pane */
.fasting-gauge-wrap{text-align:center;padding:10px 0}
.fasting-timer-display{font-family:'Montserrat',sans-serif;font-size:32px;font-weight:900;color:var(--cyan-neon);text-shadow:0 0 15px var(--cyan-glow);margin-bottom:4px}
.fasting-stage-title{font-size:13px;font-weight:800;color:#fff;margin-bottom:12px}
.fasting-progress-track{height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden;border:1px solid var(--border-subtle);margin-bottom:14px;position:relative}
.fasting-progress-fill{height:100%;background:linear-gradient(to right,var(--cyan-dark),var(--cyan-neon),var(--green-neon));box-shadow:0 0 12px var(--cyan-glow);transition:width .4s ease}
.fasting-stages-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stage-btn{background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;transition:all .2s}
.stage-btn.active{border-color:var(--green-neon);background:rgba(0,255,135,0.1);box-shadow:0 0 10px rgba(0,255,135,0.2)}
.stage-btn-h{font-size:10px;font-weight:800;color:var(--silver)}
.stage-btn.active .stage-btn-h{color:var(--green-neon)}
.stage-btn-txt{font-size:9.5px;color:var(--silver-light);margin-top:2px}

/* Meal Plan Pane */
.meal-demo-card{background:rgba(255,255,255,0.03);border:1px solid var(--border-glass);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.meal-demo-time{font-size:10px;font-weight:800;color:var(--cyan-neon);text-transform:uppercase;letter-spacing:0.5px}
.meal-demo-name{font-size:12px;font-weight:700;color:#fff;margin-top:2px}
.meal-demo-cal{font-size:11px;color:var(--silver);font-weight:600}



/* ===== DUAL PRICING TABLE ===== */
.pricing-section{padding:0 20px;margin:24px 0}
.pricing-grid{display:flex;flex-direction:column;gap:18px}
.plan-card-box{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(14px);border-radius:22px;overflow:hidden;position:relative;transition:all .25s ease}
.plan-card-box.pro-featured{border:2px solid var(--cyan-neon);box-shadow:0 0 30px var(--cyan-glow);background:linear-gradient(180deg, rgba(0, 242, 255, 0.08) 0%, rgba(18, 24, 32, 0.85) 100%)}
.pro-ribbon{background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));color:#06080A;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:900;text-align:center;padding:7px;letter-spacing:1px;text-transform:uppercase}
.plan-card-body{padding:20px}
.plan-card-title{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:900;color:#fff;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.plan-card-subtitle{font-size:12px;color:var(--silver);margin-bottom:14px;line-height:1.4}
.plan-price-wrap{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border-subtle)}
.plan-price-inst{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:900;color:var(--cyan-neon);text-shadow:0 0 10px var(--cyan-glow)}
.plan-card-box.basic-plan .plan-price-inst{color:#fff;text-shadow:none}
.plan-price-total{font-size:11.5px;color:var(--silver);margin-top:2px}
.plan-features-list{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.plan-feat{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--silver-light)}
.plan-feat.included{color:#fff;font-weight:600}
.plan-feat.excluded{color:rgba(255,255,255,0.35);text-decoration:line-through}
.plan-feat-icon{font-size:14px;flex-shrink:0}
.cta-btn-basic{width:100%;padding:16px;background:rgba(255,255,255,0.08);color:#fff;border:1px solid var(--border-glass);border-radius:14px;font-family:'Montserrat',sans-serif;font-size:13.5px;font-weight:800;cursor:pointer;transition:all .2s;text-transform:uppercase}
.cta-btn-basic:hover{background:rgba(255,255,255,0.15);border-color:var(--silver-light)}

/* ===== CRO 1: DIAGNOSTIC REPORT CARD ===== */
.diag-report-card{background:linear-gradient(180deg, rgba(0,242,255,0.06) 0%, rgba(18,24,32,0.85) 100%);border:1.5px solid var(--border-glass);backdrop-filter:blur(16px);border-radius:22px;padding:20px;margin:16px 20px;box-shadow:0 0 25px rgba(0,242,255,0.15)}
.diag-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border-subtle)}
.diag-user-title{font-family:'Montserrat',sans-serif;font-size:13.5px;font-weight:900;color:#fff}
.diag-tag{background:rgba(255,59,92,0.15);color:var(--red-neon);border:1px solid var(--red-neon);font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:12px;text-transform:uppercase}
.diag-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.diag-stat-box{background:rgba(0,0,0,0.3);border:1px solid var(--border-subtle);border-radius:14px;padding:12px;text-align:center}
.diag-stat-label{font-size:11px;color:var(--silver);margin-bottom:4px}
.diag-stat-val{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:900;color:var(--cyan-neon);text-shadow:0 0 10px var(--cyan-glow)}

.weekly-projection-title{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;color:#fff;margin-bottom:10px;text-align:center}
.weekly-projection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.proj-step{background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);border-radius:12px;padding:10px 6px;text-align:center}
.proj-week{font-size:10px;font-weight:800;color:var(--silver);text-transform:uppercase}
.proj-weight{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:900;color:var(--green-neon);margin-top:2px}

/* ===== CRO 2: AUDIO PLAYER CARD ===== */
.audio-player-card{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(14px);border-radius:20px;padding:14px;margin:16px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 0 20px rgba(0,242,255,0.1)}
.audio-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;border:2px solid var(--cyan-neon);flex-shrink:0;box-shadow:0 0 12px var(--cyan-glow)}
.audio-btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--cyan-neon),var(--cyan-dark));border:none;color:#06080A;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 12px var(--cyan-glow);transition:all .2s}
.audio-btn:hover{transform:scale(1.05)}
.audio-waveform{display:flex;align-items:center;gap:3px;height:22px;flex:1}
.wave-bar{width:3px;height:25%;background:var(--cyan-neon);border-radius:2px;transition:height .2s ease}
.audio-waveform.playing .wave-bar{animation:waveAnim 0.8s ease-in-out infinite alternate}
.audio-waveform.playing .wave-bar:nth-child(2n){animation-delay:0.15s}
.audio-waveform.playing .wave-bar:nth-child(3n){animation-delay:0.3s}
@keyframes waveAnim{0%{height:20%}100%{height:100%}}

/* ===== CRO 3: BONUSES STACK ===== */
.bonuses-section{padding:0 20px;margin:24px 0}
.bonus-card{background:var(--bg-card);border:1px solid var(--border-glass);backdrop-filter:blur(12px);border-radius:18px;padding:16px;margin-bottom:12px;display:flex;align-items:start;gap:14px;position:relative;overflow:hidden}
.bonus-badge{position:absolute;top:10px;right:10px;background:var(--green-neon);color:#06080A;font-size:9.5px;font-weight:900;padding:2px 8px;border-radius:10px;text-transform:uppercase;box-shadow:0 0 8px var(--green-neon)}
.bonus-icon{font-size:32px;flex-shrink:0;filter:drop-shadow(0 0 8px var(--cyan-glow))}
.bonus-title{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:800;color:#fff;margin-bottom:4px;padding-right:50px}
.bonus-desc{font-size:12px;color:var(--silver-light);line-height:1.45;margin-bottom:6px}
.bonus-price{font-size:11px;color:var(--silver)}
.bonus-price del{color:var(--red-neon);margin-right:4px}

/* ===== CRO 4: COUPON BANNER ===== */
.coupon-banner{background:linear-gradient(135deg, rgba(0,242,255,0.12), rgba(0,255,135,0.12));border:1px dashed var(--cyan-neon);border-radius:14px;padding:12px 16px;text-align:center;margin:16px 20px;box-shadow:0 0 15px rgba(0,242,255,0.15)}
.coupon-txt{font-family:'Montserrat',sans-serif;font-size:11.5px;font-weight:900;color:var(--cyan-neon);letter-spacing:0.5px;text-transform:uppercase}

@keyframes pulseFloat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ===== NEWS MARQUEE CAROUSEL ===== */
.news-marquee-wrap {
  margin: 0;
  overflow: hidden;
  position: relative;
  background: rgba(255, 255, 255, 0.01);
  border-bottom: 1px solid var(--border-subtle);
  padding: 8px 0;
  width: 100%;
  flex-shrink: 0;
}
.news-marquee-title {
  text-align: center;
  font-size: 10px;
  color: var(--silver);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 700;
  margin-bottom: 12px;
  opacity: 0.7;
}
.news-marquee-container {
  display: flex;
  width: 100%;
  overflow: hidden;
  user-select: none;
}
.news-marquee-track {
  display: flex;
  width: max-content;
  animation: marquee-scroll 20s linear infinite;
  gap: 35px;
  align-items: center;
}
.news-logo-item {
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0.45;
  transition: opacity 0.3s ease, filter 0.3s ease;
  filter: grayscale(1) brightness(1.5);
  overflow: visible;
}
.news-logo-item:hover {
  opacity: 0.95;
  filter: grayscale(0) brightness(1);
}
.news-logo-item svg {
  height: 100%;
  width: auto;
  fill: var(--silver-light);
  overflow: visible;
}
@keyframes marquee-scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
</style>

  <div id="quiz-section">
    <div class="quiz-header" id="hdr">
      <button class="btn-back" id="btnBack" onclick="goBack()">←</button>
      <div class="logo">
        <span class="logo-badge">LAB</span> METASYNC IA
      </div>
    </div>
    <div class="progress-bar-wrap" id="pbWrap">

const QUESTION_IDS = ['goal','age','workroutine','restrictions','dislikedfoods','mealpref','maindifficulty','exercise','ifknowledge','height','curweight','tgtweight'];
const TOTAL_Q = 12;


function render(){
  const step = STEPS[currentStep];
  const wrap = document.getElementById('stepWrap');
  const pbWrap = document.getElementById('pbWrap');
  const pbFill = document.getElementById('pbFill');
  const back = document.getElementById('btnBack');

  if (!wrap || !step) return;

  const isQuestion = QUESTION_IDS.includes(step.id);
  const qIdx = QUESTION_IDS.indexOf(step.id);

  if (pbWrap && back && pbFill) {
    if(step.type === 'intro'){
      pbWrap.style.display = 'none';
      back.style.display = 'none';
    } else {
      pbWrap.style.display = 'block';
      back.style.display = (currentStep > 1) ? 'block' : 'none';
      const pct = isQuestion
        ? Math.round(((qIdx+1)/TOTAL_Q)*100)
        : Math.min(99, Math.round((currentStep/STEPS.length)*100));
      pbFill.style.width = pct + '%';
    }
  }

  wrap.className = 'step-wrap ' + (goingBack ? 'anim-back' : 'anim-in');
  goingBack = false;

  switch(step.type){
    case 'intro':           wrap.innerHTML = renderIntro(); break;
    case 'single':          wrap.innerHTML = renderSingle(step); break;
    case 'multi':           wrap.innerHTML = renderMulti(step); break;
    case 'multi-exclusive': wrap.innerHTML = renderMultiExclusive(step); break;
    case 'multi-card':      wrap.innerHTML = renderMultiCard(step); break;
    case 'slider':          wrap.innerHTML = renderSlider(step); postSlider(step); break;
    case 'food-picker':     wrap.innerHTML = renderFoodPicker(); break;
    case 'loading':         wrap.innerHTML = renderLoading(); startLoading(); break;
    case 'result':          wrap.innerHTML = renderResult(); break;
    default: wrap.innerHTML = '<p>Step not found</p>';
  }
  window.scrollTo(0,0);
  saveQuizProgress();

  // ── Rastreamento granular ────────────────────────────────────────────
  try {
    if(typeof fbq === 'function' && step && step.id) {
      if(isQuestion) {
        fbq('trackCustom', 'quiz_step_completed', {
          step_id: step.id,
          question_number: qIdx + 1,
          total_questions: TOTAL_Q
        });
      }
    }
  } catch(e){}
}

function showValidationError(msg){
  haptic();
  let err = document.getElementById('valError');
  if(!err){
    err = document.createElement('div');
    err.id = 'valError';
    err.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(255,59,92,0.95);color:#fff;border:1px solid #FF3B5C;backdrop-filter:blur(10px);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 0 20px rgba(255,59,92,0.4);z-index:10000;text-align:center;max-width:360px;width:90%;transition:all .3s ease';
    document.body.appendChild(err);
  }
  err.textContent = '⚠️ ' + msg;
  err.style.display = 'block';
  setTimeout(() => {
    if(err) err.style.display = 'none';
  }, 3200);
}

function validateCurrentStep(){
  const step = STEPS[currentStep];
  if(!step) return true;

  if(step.type === 'single'){
    if(step.key && !ud[step.key]){
      showValidationError('Por favor, selecione uma opção para continuar.');
      return false;
    }
  }

  if(step.type === 'multi' || step.type === 'multi-card' || step.type === 'multi-exclusive'){
    const val = ud[step.key];
    if(!val || val.length === 0){
      showValidationError('Por favor, selecione pelo menos 1 opção para continuar.');
      return false;
    }
  }

  if(step.type === 'age-input'){
    const age = ud.exactAge;
    if(!age || isNaN(age) || age < 18 || age > 100){
      showValidationError('Por favor, informe uma idade válida (entre 18 e 100 anos).');
      const input = document.getElementById('ageIn');
      if(input) { input.focus(); input.style.border = '2px solid var(--red-neon)'; }
      return false;
    }
  }

  return true;
}

function triggerSyncNext(){
  if(!validateCurrentStep()) return;
  haptic();

  // Disparar quiz_started ao sair da intro
  const step = STEPS[currentStep];
  if(step && step.type === 'intro') {
    try {
      if(typeof fbq === 'function') {
        fbq('trackCustom', 'quiz_started', {});
      }
    } catch(e){}
  }

  const app = document.getElementById('app');
  const sync = document.createElement('div');
  sync.className = 'sync-overlay';
  sync.innerHTML = `
    <div class="sync-spinner"></div>
    <div class="sync-text">Sincronizando...</div>
  `;
  app.appendChild(sync);

  setTimeout(() => {
    sync.remove();
    next();
  }, 480);
}

function next(){ if(currentStep < STEPS.length-1){ currentStep++; render(); } }
function goBack(){ if(currentStep > 0){ goingBack=true; currentStep--; render(); } }

        <div style="height:140px;overflow:hidden"><img src="gender_woman.png" alt="Mulher" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="padding:10px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px"><span>Mulher</span><span style="color:var(--cyan-neon)">›</span></div>
      </div>
    </div>
  </div>`;
}

function selGender(g, el){
  haptic();
  ud.gender = g;
  triggerSyncNext();
}

let offerTimerStarted = false;
function startOfferTimer(){
  if(offerTimerStarted) return;
  offerTimerStarted = true;
  let duration = 9 * 60 + 59;
  const timerEl = document.getElementById('offerCountdown');
  const interval = setInterval(() => {
    if(duration <= 0) {
      clearInterval(interval);
      if(timerEl) timerEl.textContent = "00:00";
      return;
    }
    duration--;
    const mins = String(Math.floor(duration / 60)).padStart(2, '0');
    const secs = String(duration % 60).padStart(2, '0');
    if(timerEl) timerEl.textContent = `${mins}:${secs}`;
  }, 1000);
}

let toastIndex = 0;
let socialToastStarted = false;
function startSocialToastNotification(){
  if(socialToastStarted) return;
  socialToastStarted = true;
  const toasts = ud.gender === 'homem' ? [
    { n: 'Marcos S.', c: 'São Paulo - SP', t: 'há 2 min' },
    { n: 'Felipe M.', c: 'Belo Horizonte - MG', t: 'há 4 min' },
    { n: 'Eduardo R.', c: 'Curitiba - PR', t: 'há 1 min' },
    { n: 'Lucas T.', c: 'Rio de Janeiro - RJ', t: 'há 3 min' },
    { n: 'Rafael B.', c: 'Porto Alegre - RS', t: 'há 5 min' }
  ] : [
    { n: 'Mariana S.', c: 'São Paulo - SP', t: 'há 2 min' },
    { n: 'Juliana M.', c: 'Belo Horizonte - MG', t: 'há 4 min' },
    { n: 'Camila R.', c: 'Curitiba - PR', t: 'há 1 min' },
    { n: 'Beatriz T.', c: 'Rio de Janeiro - RJ', t: 'há 3 min' },
    { n: 'Fernanda B.', c: 'Porto Alegre - RS', t: 'há 5 min' }
  ];

  let container = document.getElementById('socialToast');
  if(!container){
    container = document.createElement('div');
    container.id = 'socialToast';
    document.body.appendChild(container);
  }

  function showNextToast(){
    const item = toasts[toastIndex % toasts.length];
    toastIndex++;
    container.innerHTML = `
      <div class="toast-avatar">⚡</div>
      <div class="toast-body">
        <strong>${item.n}</strong> (${item.c}) acabou de ativar o <strong>METASYNC IA</strong>!
        <div class="toast-time">Ativação realizada ${item.t}</div>
      </div>
    `;
    container.classList.add('show');
    setTimeout(() => {
      container.classList.remove('show');
    }, 4500);
  }

  setTimeout(showNextToast, 2500);
  setInterval(showNextToast, 11000);
}

function returnToQuizFromSales(){
  haptic();
  document.getElementById('sales-page').style.display = 'none';
  document.getElementById('quiz-section').style.display = 'block';
  currentStep = 0;
  render();
}

function checkAutoShowSales(){
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get('sales') === '1' || params.get('sales') === 'true' || params.get('demo') === '1') {
      showSales();
      return true;
    }
    const openedCheckout = localStorage.getItem('metasync_opened_checkout') === 'true';
    const completedQuiz = localStorage.getItem('metasync_completed_quiz') === 'true';
    if (openedCheckout || completedQuiz) {
      const savedUd = localStorage.getItem('metasync_user_data');
      if (savedUd) {
        Object.assign(ud, JSON.parse(savedUd));
      }
      showSales();
      return true;
    }
  } catch (e) {}
  return false;
}

function initApp(){
  try {
    if (!checkAutoShowSales()) {
      render();
    }
  } catch(e) {
    console.error("Erro na inicializacao:", e);
    try { render(); } catch(err) {}
  }
}

if (document.readyState === 'interactive' || document.readyState === 'complete') {
  initApp();
} else {
  document.addEventListener('DOMContentLoaded', initApp);
}
</script>
